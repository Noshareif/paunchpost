function listCard(l){const cs=sentC().filter(c=>c.listIds.includes(l.id));const a=aggStats(cs);
 return `<div class="card"><div class="card-h"><div style="min-width:0"><h3>${esc(l.name)}</h3><div class="small muted">${esc(l.note||'No description')} · created ${fmtD(l.created)}</div></div><div class="menu-wrap"><button class="btn sm ghost" data-act="toggleMenu" aria-label="List actions">⋯</button><div class="menu"><button data-act="listRename" data-id="${l.id}">Rename</button><button data-act="listDesc" data-id="${l.id}">Edit description</button><button data-act="listExport" data-id="${l.id}">Export contacts</button><div class="sep"></div><button class="danger" data-act="listDelete" data-id="${l.id}">Delete audience</button></div></div></div>
 <div class="card-b"><div class="grid g4" style="gap:10px">${mini('Contacts',num(l.size))}${mini('Subscribed',num(l.subs))}${mini('Avg. open',cs.length?pct(a.openRate):'—')}${mini('Avg. click',cs.length?pct(a.clickRate,2):'—')}</div><div class="flex wrap mt"><button class="btn sm" data-act="viewList" data-id="${l.id}">View contacts</button><button class="btn sm" data-act="campToList" data-id="${l.id}">Email this audience</button><button class="btn sm" data-act="importToList" data-id="${l.id}">Import into this audience</button></div></div></div>`;}
A.newList=()=>{const srcs=S.lists.filter(l=>l.reminder);modal({title:'Create audience',body:`<div class="field"><label for="nl-name">Audience name</label><input type="text" id="nl-name" placeholder="e.g. SkyLens Open Dental batch 2"></div>
 <div class="field"><label for="nl-note">Description <span class="muted small">(optional, only you see it)</span></label><input type="text" id="nl-note"></div>
 <div class="field"><label for="nl-sender">Default sender for campaigns to this audience</label><select id="nl-sender">${S.senders.map(x=>`<option value="${x.id}" ${x.id===S.settings.defaultSender?'selected':''}>${esc(x.name)} &lt;${esc(x.email)}&gt;</option>`).join('')}</select></div>
 <div class="field"><label for="nl-rem">How did these people sign up? <span class="muted small">(shown in the email footer)</span></label><textarea id="nl-rem" rows="2">${esc(S.settings.reminder)}</textarea><div class="hint">Reminding people how they got on the list cuts down on spam reports.</div></div>
 <div class="notice" style="margin:0">Footer address, unsubscribe link and notifications come from <a href="#/settings/compliance" data-act="closeModalGo" data-href="#/settings/compliance">Settings</a>, so you don’t re-enter them for each list.</div>`,
 foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn" data-act="newListGo" data-imp="0">Create audience only</button><button class="btn pri" data-act="newListGo" data-imp="1">Create audience & import contacts</button>`,mount:()=>$('#nl-name').focus()});};
A.newListGo=t=>{const n=$('#nl-name').value.trim();if(!n){toast('Name the audience');return;}if(S.lists.some(l=>l.name.toLowerCase()===n.toLowerCase())){toast('An audience with that name already exists');return;}const l={id:uid('l'),name:n,note:$('#nl-note').value.trim(),senderId:$('#nl-sender').value,reminder:$('#nl-rem').value.trim(),created:nowISO(),size:0,subs:0};S.lists.push(l);closeModal();render();if(t.dataset.imp==='1'){A.importContacts();IMP.list=l.id;impRender();}else toast('Audience created');};
A.viewList=t=>{Object.assign(UI.ct,{list:t.dataset.id,q:'',status:'all',tag:'all',source:'all',seg:'',page:1});nav('#/contacts');};
A.campToList=t=>{const l=getL(t.dataset.id);const c=newDraft('Email to '+l.name);c.listIds=[l.id];if(l.senderId)c.senderId=l.senderId;c.html=BLANK();UI.build.open='subject';nav('#/campaign/'+c.id);};
A.listRename=t=>{const l=getL(t.dataset.id);promptBox('Rename audience','Audience name',l.name,v=>{l.name=v;render();toast('Renamed');});};
A.listDesc=t=>{const l=getL(t.dataset.id);promptBox('Edit description','Description',l.note||'',v=>{l.note=v;render();});};
A.listExport=t=>{const l=getL(t.dataset.id);exportContactsCSV(S.contacts.filter(x=>x.lists.includes(l.id)),fileSlug(l.name)+'.csv');};
A.listDelete=t=>{const l=getL(t.dataset.id);confirmBox('Delete the audience “'+esc(l.name)+'”?','The contacts aren’t deleted. They’re only taken out of this audience. Past reports keep its name, and anyone who unsubscribed, bounced or complained <b>stays suppressed</b>, so deleting an audience can never cause you to email them again.','Delete audience',()=>{S.campaigns.forEach(c=>{if(c.listIds.includes(l.id)){if(c.status==='sent')c.audience=audLabel(c);c.listIds=c.listIds.filter(x=>x!==l.id);}c.excludeIds=c.excludeIds.filter(x=>x!==l.id);});S.contacts.forEach(x=>{x.lists=x.lists.filter(y=>y!==l.id);});S.lists=S.lists.filter(x=>x.id!==l.id);render();toast('Audience deleted');});};
function vTags(){return `<div class="page-h"><div><h1>Tags</h1><div class="sub">Labels you add to contacts, like “Open Dental” or “DSO”. Send to a tag, or use tags in segments.</div></div><div class="flex"><button class="btn" data-act="bulkTag">Tag a list of emails</button><button class="btn pri" data-act="newTag">+ Create tag</button></div></div>
 <div class="card"><table class="t"><thead><tr><th>Tag</th><th class="num">Subscribed</th><th class="right">Actions</th></tr></thead><tbody>${S.tags.map(t=>`<tr><td><span class="chip" style="font-size:13px">${esc(t)}</span></td><td class="num">${num(tagEst(t))}</td><td class="right"><div class="flex" style="justify-content:flex-end;gap:4px"><button class="btn sm" data-act="tagView" data-v="${esc(t)}">View contacts</button><button class="btn sm" data-act="tagSend" data-v="${esc(t)}">Email this tag</button><div class="menu-wrap"><button class="btn sm ghost" data-act="toggleMenu" aria-label="Tag actions">⋯</button><div class="menu"><button data-act="tagRename" data-v="${esc(t)}">Rename</button><button class="danger" data-act="tagDelete" data-v="${esc(t)}">Delete</button></div></div></div></td></tr>`).join('')}</tbody></table></div>`;}
A.newTag=()=>promptBox('Create tag','Tag name','',v=>{if(!S.tags.includes(v))S.tags.push(v);render();toast('Tag created');},'Create');
A.tagView=t=>{Object.assign(UI.ct,{tag:t.dataset.v,list:'all',q:'',status:'all',source:'all',seg:'',page:1});nav('#/contacts');};
A.tagSend=t=>{const c=newDraft('Email to tag: '+t.dataset.v);c.tagIds=[t.dataset.v];c.html=BLANK();UI.build.open='subject';nav('#/campaign/'+c.id);};
A.tagRename=t=>{const old=t.dataset.v;promptBox('Rename tag','Tag name',old,v=>{S.tags=S.tags.map(x=>x===old?v:x);S.contacts.forEach(x=>{x.tags=x.tags.map(y=>y===old?v:y);});S.campaigns.forEach(c=>{c.tagIds=c.tagIds.map(y=>y===old?v:y);c.excludeIds=c.excludeIds.map(y=>y==='t:'+old?'t:'+v:y);});S.segments.forEach(g=>g.conds.forEach(k=>{if(k.f==='tag'&&k.v===old)k.v=v;}));render();toast('Renamed');});};
A.tagDelete=t=>{const v=t.dataset.v;confirmBox('Delete the tag “'+esc(v)+'”?','It’s removed from every contact. Contacts aren’t deleted.','Delete tag',()=>{S.tags=S.tags.filter(x=>x!==v);S.contacts.forEach(x=>{x.tags=x.tags.filter(y=>y!==v);});S.campaigns.forEach(c=>{c.tagIds=c.tagIds.filter(y=>y!==v);c.excludeIds=c.excludeIds.filter(y=>y!=='t:'+v);});render();toast('Tag deleted');});};
A.bulkTag=()=>{modal({title:'Tag a list of emails',body:`<div class="field"><label for="bt-tag">Tag</label><input type="text" id="bt-tag" list="bt-dl" placeholder="Type a new tag or pick one"><datalist id="bt-dl">${S.tags.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label for="bt-em">Email addresses</label><textarea id="bt-em" rows="7" placeholder="One per line, or separated by commas"></textarea></div>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="bulkTagGo">Add tag</button>`});};
A.bulkTagGo=()=>{const tg=$('#bt-tag').value.trim();if(!tg){toast('Enter a tag');return;}const ems=$('#bt-em').value.split(/[\s,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);let hit=0,miss=0;ems.forEach(em=>{const x=S.contacts.find(o=>o.email.toLowerCase()===em);if(x){if(!x.tags.includes(tg))x.tags.push(tg);hit++;}else miss++;});if(!S.tags.includes(tg))S.tags.push(tg);closeModal();render();toast('Tagged '+hit+' contacts'+(miss?' · '+miss+' not found':''));};
function condText(k){const F=FIELDS[k.f];let v=k.v;if(F.type==='list')v=(getL(v)||{}).name||'(deleted list)';if(F.type==='campaign')v=v==='any'?'any campaign in the last 30 days':'“'+((getC(v)||{}).name||'deleted campaign')+'”';if(F.type==='engagement')v=v==='active'?'active (opened in last 90 days)':'inactive (no opens in 90 days)';if(F.type==='status')v=STATUS_L[v]||v;return F.l+' '+F.ops[k.op]+' '+v;}
function vSegments(){return `<div class="page-h"><div><h1>Segments</h1><div class="sub">Saved filters that update themselves, like “didn’t open the pricing email” or “Open Dental clients”. You can send a campaign to any segment.</div></div><button class="btn pri" data-act="newSegment">+ Create segment</button></div>
 <div class="card">${S.segments.length?`<table class="t"><thead><tr><th>Segment</th><th>Conditions</th><th class="num">Subscribed</th><th class="right">Actions</th></tr></thead><tbody>${S.segments.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td class="small" style="max-width:420px">${g.conds.map(k=>esc(condText(k))).join(g.match==='any'?' <b>or</b> ':' <b>and</b> ')}</td><td class="num">${num(segEst(g))}</td><td class="right"><div class="flex" style="justify-content:flex-end;gap:4px"><button class="btn sm" data-act="segView" data-id="${g.id}">View contacts</button><button class="btn sm" data-act="segUse" data-id="${g.id}">Email this segment</button><div class="menu-wrap"><button class="btn sm ghost" data-act="toggleMenu" aria-label="Segment actions">⋯</button><div class="menu"><button data-act="editSegment" data-id="${g.id}">Edit</button><button class="danger" data-act="segDelete" data-id="${g.id}">Delete</button></div></div></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No segments yet.</div>'}</div>`;}
let SD=null;
A.newSegment=()=>{SD={id:null,name:'',match:'all',conds:[{f:'tag',op:'has',v:S.tags[0]}]};openSegModal();};
A.editSegment=t=>{SD=JSON.parse(JSON.stringify(getSeg(t.dataset.id)));openSegModal();};
function openSegModal(){modal({title:SD.id?'Edit segment':'New segment',wide:true,body:`<div id="seg-body">${segBody()}</div>`,foot:`<span id="seg-count" class="small" style="margin-right:auto">${segCountText()}</span><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="segSave">Save segment</button>`});}
function segBody(){return `<div class="grid g2"><div class="field"><label for="sg-name">Segment name</label><input type="text" id="sg-name" value="${esc(SD.name)}" placeholder="e.g. Open Dental clients who clicked"></div><div class="field"><label>Contacts must match</label>${sel('segMatch','match',SD.match,[['all','All of these conditions'],['any','Any of these conditions']])}</div></div>${SD.conds.map((k,i)=>condRow(k,i)).join('')}<button class="btn sm" data-act="segAddCond">+ Add condition</button>`;}
function condRow(k,i){const F=FIELDS[k.f];return `<div class="cond">${sel('segF',k.f,k.f,Object.entries(FIELDS).map(([f,d])=>[f,d.l]),'data-i="'+i+'" aria-label="Field"')}${sel('segOp',k.op,k.op,Object.entries(F.ops),'data-i="'+i+'" aria-label="Condition"')}${valInput(k,i)}<button class="btn sm ghost" data-act="segDelCond" data-i="${i}" aria-label="Remove condition">×</button></div>`;}
function valInput(k,i){const F=FIELDS[k.f];const o=arr=>sel('segVc','v',k.v,arr,'data-i="'+i+'" aria-label="Value"');switch(F.type){
 case 'list':return o(S.lists.map(l=>[l.id,l.name]));case 'tag':return o(S.tags.map(t=>[t,t]));case 'status':return o([['subscribed','Subscribed'],['unsubscribed','Unsubscribed'],['cleaned','Bounced (cleaned)']]);
 case 'source':return o([...new Set(S.contacts.map(x=>x.source))].map(s=>[s,s]));case 'campaign':return o([['any','Any campaign in the last 30 days'],...sentC().sort(byDateDesc).map(c=>[c.id,c.name])]);
 case 'engagement':return o([['active','Active (opened in the last 90 days)'],['inactive','Inactive (no opens in 90 days)']]);
 case 'date':return `<input type="date" value="${esc(k.v)}" data-ch="segVc" data-i="${i}" aria-label="Date">`;
 default:return `<input type="text" value="${esc(k.v)}" data-in="segV" data-i="${i}" placeholder="Value" aria-label="Value">`;}}
function segCountText(){const subs=subsSample();const m=S.contacts.filter(x=>matchSeg(x,SD));const ms=m.filter(x=>x.status==='subscribed').length;return `<b>≈ ${num(Math.round(ms/subs.length*TOTAL))}</b> subscribed contacts match <span class="muted">(${m.length} in the sample)</span>`;}
function redrawSeg(){const n=$('#sg-name');if(n)SD.name=n.value;$('#seg-body').innerHTML=segBody();segCount();}
CH.segF=t=>{const k=SD.conds[+t.dataset.i];k.f=t.value;k.op=Object.keys(FIELDS[k.f].ops)[0];k.v=FIELD_DEFAULT(k.f);redrawSeg();};
CH.segOp=t=>{SD.conds[+t.dataset.i].op=t.value;segCount();};
CH.segVc=t=>{SD.conds[+t.dataset.i].v=t.value;segCount();};
IN.segV=t=>{SD.conds[+t.dataset.i].v=t.value;segCount();};
CH.segMatch=t=>{SD.match=t.value;segCount();};
A.segAddCond=()=>{SD.conds.push({f:'list',op:'in',v:(S.lists[0]||{}).id});redrawSeg();};
A.segDelCond=t=>{SD.conds.splice(+t.dataset.i,1);redrawSeg();};
A.segSave=()=>{const n=$('#sg-name').value.trim();if(!n){toast('Give the segment a name');return;}SD.name=n;if(SD.id){const i=S.segments.findIndex(g=>g.id===SD.id);S.segments[i]=SD;}else{SD.id=uid('sg');S.segments.push(SD);}closeModal();render();toast('Segment saved');};
A.segView=t=>{Object.assign(UI.ct,{seg:t.dataset.id,list:'all',q:'',status:'all',tag:'all',source:'all',page:1});nav('#/contacts');};
A.segUse=t=>{const g=getSeg(t.dataset.id);const c=newDraft('Email to segment: '+g.name);c.segmentIds=[g.id];c.html=BLANK();UI.build.open='subject';nav('#/campaign/'+c.id);};
A.segDelete=t=>{const g=getSeg(t.dataset.id);confirmBox('Delete the segment “'+esc(g.name)+'”?','Contacts aren’t affected. Drafts that use this segment will need new recipients.','Delete',()=>{S.segments=S.segments.filter(x=>x.id!==g.id);S.campaigns.forEach(c=>{c.segmentIds=c.segmentIds.filter(x=>x!==g.id);c.excludeIds=c.excludeIds.filter(x=>x!==g.id);});if(UI.ct.seg===g.id)UI.ct.seg='';render();toast('Segment deleted');});};
function supFiltered(){const u=UI.sup;let xs=S.suppression.slice();if(u.q){const q=u.q.toLowerCase();xs=xs.filter(s=>s.email.toLowerCase().includes(q));}if(u.reason!=='all')xs=xs.filter(s=>u.reason==='bounce'?/bounce/i.test(s.reason):u.reason==='complaint'?/complaint/i.test(s.reason):!/bounce|complaint/i.test(s.reason));return xs.sort((a,b)=>new Date(b.date)-new Date(a.date));}
function supTable(){const xs=supFiltered();if(!xs.length)return '<div class="empty">No matching addresses.</div>';return `<div style="overflow:auto"><table class="t"><thead><tr><th>Email</th><th>Reason</th><th>Date</th><th>Source</th><th class="right"></th></tr></thead><tbody>${xs.map(s=>`<tr><td>${esc(s.email)}</td><td><span class="badge ${/bounce|complaint/i.test(s.reason)?'b-bad':'b-unsub'}">${esc(s.reason)}</span></td><td class="small">${fmtD(s.date)}</td><td class="small">${esc(s.source)}</td><td class="right"><button class="btn sm" data-act="supRemove" data-v="${esc(s.email)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`;}
function vSuppression(){const u=UI.sup;return `<div class="page-h"><div><h1>Unsubscribes & bounces</h1><div class="sub">Every address here is skipped by every campaign, even if it’s imported again. Amazon fills this in automatically when someone unsubscribes, bounces, or marks an email as spam.</div></div><div class="flex"><button class="btn" data-act="supExport">⇩ Export</button><button class="btn pri" data-act="unsubEmails">+ Unsubscribe emails</button></div></div>
 <div class="grid g3 mb">${kpi('Unsubscribed',num(S.suppression.filter(s=>!/bounce|complaint/i.test(s.reason)).length))}${kpi('Hard bounces',num(S.suppression.filter(s=>/bounce/i.test(s.reason)).length))}${kpi('Spam complaints',num(S.suppression.filter(s=>/complaint/i.test(s.reason)).length))}</div>
 <div class="card"><div class="toolbar"><input type="search" placeholder="Search email" value="${esc(u.q)}" data-in="supQ" aria-label="Search suppressed emails">${sel('supF','reason',u.reason,[['all','All reasons'],['unsub','Unsubscribed'],['bounce','Bounced'],['complaint','Spam complaints']])}</div><div id="sup-table">${supTable()}</div></div>`;}
IN.supQ=t=>{UI.sup.q=t.value;$('#sup-table').innerHTML=supTable();};
CH.supF=t=>{UI.sup.reason=t.value;$('#sup-table').innerHTML=supTable();};
A.supExport=()=>{download('suppression-list.csv',csv([['Email','Reason','Date','Source'],...S.suppression.map(s=>[s.email,s.reason,fmtD(s.date),s.source])]));toast('Exported');};
A.supRemove=t=>{const em=t.dataset.v;const s=S.suppression.find(x=>x.email===em);const risky=/bounce|complaint/i.test(s.reason);confirmBox('Remove '+esc(em)+' from the suppression list?',(risky?'<b>This address '+(/bounce/i.test(s.reason)?'bounced':'reported you as spam')+'.</b> Emailing it again hurts your sender reputation. ':'')+'Only do this if the person asked to be added back.','Remove',()=>{S.suppression=S.suppression.filter(x=>x.email!==em);const x=S.contacts.find(o=>o.email===em);if(x)resubscribe(x);render();toast('Removed. They can be emailed again');});};
function vImports(){return `<div class="page-h"><div><h1>Import history</h1><div class="sub">Every list you’ve uploaded or pasted.</div></div><button class="btn pri" data-act="importContacts">⇪ Import contacts</button></div><div class="card"><div style="overflow:auto"><table class="t"><thead><tr><th>Date</th><th>Method</th><th>File</th><th>Audience</th><th class="num">Added</th><th class="num">Updated</th><th class="num">Skipped</th><th>By</th></tr></thead><tbody>${S.imports.map(i=>`<tr><td class="small">${fmtDT(i.date)}</td><td>${esc(i.method)}</td><td class="small">${esc(i.file)}</td><td>${esc(i.list)}</td><td class="num">${num(i.added)}</td><td class="num">${num(i.updated)}</td><td class="num">${num(i.skipped)}</td><td>${esc(i.by)}</td></tr>`).join('')}</tbody></table></div></div>`;}

/* ================= AUDIENCE FIELDS ================= */
function addField(label){let tag=String(label).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'field';const taken=new Set(['first_name','last_name','email','practice','title','phone','company','unsubscribe_url','view_in_browser_url',...S.fields.map(f=>f.tag)]);let t=tag,n=2;while(taken.has(t))t=tag+'_'+(n++);const f={tag:t,label:String(label).trim()||t};S.fields.push(f);return f;}
function vFields(){const base=[['Email address','email','Required. Every contact has one'],['First name','first_name',''],['Last name','last_name',''],['Practice name','practice',''],['Title','title','e.g. Dentist/Owner, Office Manager'],['Phone','phone','']];const sys=[['Unsubscribe link','unsubscribe_url','Added automatically'],['View-in-browser link','view_in_browser_url','']];
 const row=(l,t,n,act)=>`<tr><td><b>${esc(l)}</b>${n?`<div class="small muted">${esc(n)}</div>`:''}</td><td><code>{{${esc(t)}}}</code> <button class="btn sm ghost" data-act="copyTag" data-v="{{${esc(t)}}}" aria-label="Copy merge tag">⧉</button></td><td class="right">${act||'<span class="small muted">Built in</span>'}</td></tr>`;
 return `<div class="page-h"><div><h1>Fields & merge tags</h1><div class="sub">The details stored for each contact. Put a merge tag in a subject line or email, and it’s replaced with each person’s value when it sends. (Mailchimp’s <code>*|FNAME|*</code> is <code>{{first_name}}</code> here.)</div></div><button class="btn pri" data-act="fieldAdd">+ Add field</button></div>
 <div class="card mb"><table class="t"><thead><tr><th>Field</th><th>Merge tag</th><th class="right">Actions</th></tr></thead><tbody>${base.map(([l,t,n])=>row(l,t,n)).join('')}${S.fields.map(f=>row(f.label,f.tag,'Custom field',`<div class="flex" style="justify-content:flex-end;gap:4px"><button class="btn sm" data-act="fieldRename" data-v="${f.tag}">Rename</button><button class="btn sm danger" data-act="fieldDelete" data-v="${f.tag}">Delete</button></div>`)).join('')}</tbody></table></div>
 <div class="card"><div class="card-h"><h3>Links added to every email</h3></div><table class="t"><tbody>${sys.map(([l,t,n])=>row(l,t,n)).join('')}</tbody></table></div>
 <div class="small muted mt">Tip: if someone has no value for a field, the tag is left blank. Custom fields you create during an import (like Mailchimp’s “add Title as a new field”) show up here.</div>`;}
A.copyTag=t=>copyText(t.dataset.v,t.dataset.v+' copied');
A.fieldAdd=()=>promptBox('Add field','Field name (e.g. Practice software, Number of locations)','',v=>{const f=addField(v);render();toast('Added. Merge tag {{'+f.tag+'}}');},'Add field');
A.fieldRename=t=>{const f=S.fields.find(x=>x.tag===t.dataset.v);promptBox('Rename field','Field name',f.label,v=>{f.label=v;render();toast('Renamed. The merge tag stays {{'+f.tag+'}}');});};
A.fieldDelete=t=>{const f=S.fields.find(x=>x.tag===t.dataset.v);confirmBox('Delete the field “'+esc(f.label)+'”?','Its values are removed from every contact, and emails that use {{'+esc(f.tag)+'}} will show it blank.','Delete',()=>{S.fields=S.fields.filter(x=>x!==f);S.contacts.forEach(x=>{if(x.custom)delete x.custom[f.tag];});render();toast('Field deleted');});};

/* ================= TEMPLATES ================= */
const used=t=>S.campaigns.filter(c=>c.templateId===t.id).length;
function tplSorted(){const u=UI.tpl;let ts=S.templates.slice();if(u.q)ts=ts.filter(t=>t.name.toLowerCase().includes(u.q.toLowerCase()));return ts.sort(u.sort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>new Date(b.edited)-new Date(a.edited));}
const tplMenu=t=>`<div class="menu-wrap"><button class="btn sm ghost" data-act="toggleMenu" aria-label="Template actions">⋯</button><div class="menu"><button data-act="tplReplicate" data-id="${t.id}">Replicate</button><button data-act="tplRename" data-id="${t.id}">Rename</button><button data-act="tplExport" data-id="${t.id}">Export HTML</button><div class="sep"></div><button class="danger" data-act="tplDelete" data-id="${t.id}">Delete</button></div></div>`;
function tplList(){const ts=tplSorted();if(!ts.length)return '<div class="card empty">No templates match.</div>';
 if(UI.tpl.view==='list')return `<div class="card"><table class="t"><thead><tr><th>Name</th><th>Last edited</th><th class="num">Used in</th><th class="right">Actions</th></tr></thead><tbody>${ts.map(t=>`<tr><td><a class="title-link" href="#/template/${t.id}">${esc(t.name)}</a></td><td class="small">${fmtD(t.edited)}</td><td class="num">${used(t)} campaigns</td><td class="right"><div class="flex" style="justify-content:flex-end;gap:4px"><button class="btn sm pri" data-act="useTemplate" data-id="${t.id}">Use in campaign</button><a class="btn sm" href="#/template/${t.id}">Edit</a>${tplMenu(t)}</div></td></tr>`).join('')}</tbody></table></div>`;
 return `<div class="grid g3">${ts.map(t=>`<div class="card tpl-card"><div class="tpl-thumb"><iframe data-tpl="${t.id}" sandbox tabindex="-1" title="${esc(t.name)} preview"></iframe></div><div class="card-b"><a class="title-link" href="#/template/${t.id}">${esc(t.name)}</a><div class="small muted" style="margin-top:2px">Edited ${fmtD(t.edited)} · used in ${used(t)} campaigns</div><div class="flex mt" style="gap:6px"><button class="btn sm pri" data-act="useTemplate" data-id="${t.id}">Use in campaign</button><a class="btn sm" href="#/template/${t.id}">Edit</a>${tplMenu(t)}</div></div></div>`).join('')}</div>`;}
function vTemplates(){const u=UI.tpl;after.push(fillThumbs);
 return `<div class="page-h"><div><h1>Email templates</h1><div class="sub">Your coded HTML layouts. Start a campaign from any of them; the campaign gets its own copy.</div></div><div class="flex"><input type="file" id="tpl-file" accept=".html,.htm,.txt" style="display:none" data-ch="tplFile"><div class="menu-wrap"><button class="btn pri" data-act="toggleMenu">+ New template ▾</button><div class="menu"><button data-act="newTemplate">Start from the DHT layout</button><button data-act="pasteTemplate">Paste HTML code</button><button data-act="uploadTemplate">Upload an .html file</button></div></div></div></div>
 <div class="card mb"><div class="toolbar" style="border-bottom:0"><input type="search" placeholder="Search templates" value="${esc(u.q)}" data-in="tplQ" aria-label="Search templates">${sel('tplSort','sort',u.sort,[['new','Newest first'],['name','Name A–Z']])}<div class="seg" style="margin-left:auto"><button class="${u.view==='grid'?'on':''}" data-act="tplView" data-v="grid">▦ Grid</button><button class="${u.view==='list'?'on':''}" data-act="tplView" data-v="list">☰ List</button></div></div></div>
 <div id="tpl-list">${tplList()}</div>`;}
const redrawTpl=()=>{$('#tpl-list').innerHTML=tplList();fillThumbs();};
IN.tplQ=t=>{UI.tpl.q=t.value;redrawTpl();};
CH.tplSort=t=>{UI.tpl.sort=t.value;redrawTpl();};
A.tplView=t=>{UI.tpl.view=t.dataset.v;render();};
function addTemplate(name,html){const t={id:uid('t'),name,edited:nowISO(),html};S.templates.unshift(t);return t;}
A.newTemplate=()=>{const t=addTemplate('Untitled template',BLANK());nav('#/template/'+t.id);};
A.pasteTemplate=()=>{modal({title:'Paste HTML code',wide:true,body:`<div class="field"><label for="pt-name">Template name</label><input type="text" id="pt-name" value="Pasted template"></div><div class="field"><label for="pt-html">HTML</label><textarea id="pt-html" class="code" style="min-height:320px" spellcheck="false" placeholder="<!DOCTYPE html>…"></textarea></div>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="pasteTplGo">Create template</button>`});};
A.pasteTplGo=()=>{const h=$('#pt-html').value.trim();if(!h){toast('Paste some HTML first');return;}const t=addTemplate($('#pt-name').value.trim()||'Pasted template',h);closeModal();nav('#/template/'+t.id);};
A.uploadTemplate=()=>{const f=$('#tpl-file');if(f)f.click();};
CH.tplFile=t=>{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const tp=addTemplate(f.name.replace(/\.(html?|txt)$/i,''),String(r.result));toast('Template uploaded');nav('#/template/'+tp.id);};r.readAsText(f);};
A.useTemplate=t=>{const tp=getT(t.dataset.id);const c=newDraft(tp.name+' · '+fmtD(nowISO()));c.html=tp.html;c.templateId=tp.id;UI.build.open='to';nav('#/campaign/'+c.id);};
A.tplReplicate=t=>{const tp=getT(t.dataset.id);addTemplate(tp.name+' (copy)',tp.html);render();toast('Template copied');};
A.tplRename=t=>{const tp=getT(t.dataset.id);promptBox('Rename template','Template name',tp.name,v=>{tp.name=v;render();toast('Renamed');});};
A.tplExport=t=>{const tp=getT(t.dataset.id);download(fileSlug(tp.name)+'.html',tp.html,'text/html');toast('HTML downloaded');};
A.tplDelete=t=>{const tp=getT(t.dataset.id);confirmBox('Delete “'+esc(tp.name)+'”?','Campaigns that used it keep their own copy of the HTML.','Delete',()=>{S.templates=S.templates.filter(x=>x.id!==tp.id);S.campaigns.forEach(c=>{if(c.templateId===tp.id)c.templateId=null;});if(route()[0]==='template')nav('#/templates');else render();toast('Template deleted');});};
function vTemplateEditor(id){const t=getT(id);if(!t)return notFound('Template');
 after.push(()=>{const ta=$('#te');const up=()=>{const f=$('#te-pv');if(f)f.srcdoc=rendered(ta.value);};up();ta.addEventListener('input',debounce(up,250));});
 return `<div class="crumb"><a href="#/templates">Email templates</a> / ${esc(t.name)}</div>
 <div class="page-h"><input type="text" id="te-name" value="${esc(t.name)}" aria-label="Template name" style="font-size:18px;font-weight:700;width:min(420px,100%)"><div class="flex wrap">${mergeMenu()}${imageMenu()}<div class="seg"><button class="on" data-act="teDevice" data-v="desktop">Desktop</button><button data-act="teDevice" data-v="mobile">Mobile</button></div><button class="btn" data-act="tplTest" data-id="${t.id}">Send a test</button><button class="btn" data-act="tplExport" data-id="${t.id}">Export</button><button class="btn pri" data-act="teSave" data-id="${t.id}">Save template</button></div></div>
 ${used(t)?`<div class="notice">${used(t)} campaign(s) were made from this template. Saving here doesn’t change them, since each campaign keeps its own copy.</div>`:''}
 <div class="editor"><textarea id="te" class="code" spellcheck="false" style="min-height:640px" aria-label="Template HTML">${esc(t.html)}</textarea><div><iframe id="te-pv" class="preview-frame" style="height:640px" sandbox="allow-popups" title="Template preview"></iframe></div></div>`;}
A.teSave=t=>{const tp=getT(t.dataset.id);tp.name=$('#te-name').value.trim()||tp.name;tp.html=$('#te').value;tp.edited=nowISO();toast('Template saved');};
A.teDevice=t=>{$$('[data-act="teDevice"]').forEach(b=>b.classList.toggle('on',b===t));$('#te-pv').classList.toggle('mobile',t.dataset.v==='mobile');};

/* ================= CONTENT LIBRARY ================= */
function imgFiltered(){const u=UI.img;let xs=S.images.slice();if(u.q)xs=xs.filter(i=>i.name.toLowerCase().includes(u.q.toLowerCase()));if(u.folder!=='all')xs=xs.filter(i=>i.folder===u.folder);return xs.sort((a,b)=>new Date(b.date)-new Date(a.date));}
function imgList(){const xs=imgFiltered();if(!xs.length)return '<div class="card empty">No images match.</div>';
 if(UI.img.view==='list')return `<div class="card"><table class="t"><thead><tr><th></th><th>Name</th><th>Folder</th><th>Size</th><th>Uploaded</th><th class="right">Actions</th></tr></thead><tbody>${xs.map(i=>`<tr><td style="width:70px"><img src="${i.url}" alt="" style="width:56px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--line)"></td><td>${esc(i.name)}</td><td class="small">${esc(i.folder)}</td><td class="small">${esc(i.size)}${i.dims?' · '+esc(i.dims):''}</td><td class="small">${fmtD(i.date)}</td><td class="right"><div class="flex" style="justify-content:flex-end;gap:4px"><button class="btn sm" data-act="imgCopy" data-id="${i.id}">Copy link</button>${imgMenu(i)}</div></td></tr>`).join('')}</tbody></table></div>`;
 return `<div class="grid g4">${xs.map(i=>`<div class="card img-card" style="overflow:hidden"><div class="thumb"><img src="${i.url}" alt="${esc(i.name)}"></div><div class="card-b" style="padding:12px 14px"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.name)}">${esc(i.name)}</div><div class="small muted">${esc(i.folder)} · ${esc(i.size)}</div><div class="flex mt" style="gap:4px"><button class="btn sm" data-act="imgCopy" data-id="${i.id}">Copy link</button>${imgMenu(i)}</div></div></div>`).join('')}</div>`;}
function vContent(){const u=UI.img;const folders=['all',...new Set(S.images.map(i=>i.folder))];
 return `<div class="page-h"><div><h1>Content library</h1><div class="sub">${S.images.length} images. They’re stored at a public link so they show up in every inbox.</div></div><div class="flex"><input type="file" id="img-file" accept="image/*" multiple style="display:none" data-ch="imgFile"><button class="btn pri" data-act="uploadImage">⇪ Upload images</button></div></div>
 <div class="notice warn">Anyone with the link can see an uploaded image. Never upload anything showing patient or confidential information.</div>
 <div class="card mb"><div class="toolbar" style="border-bottom:0"><input type="search" placeholder="Search files" value="${esc(u.q)}" data-in="imgQ" aria-label="Search images">${sel('imgF','folder',u.folder,folders.map(f=>[f,f==='all'?'All folders':f]))}<div class="seg" style="margin-left:auto"><button class="${u.view==='grid'?'on':''}" data-act="imgView" data-v="grid">▦ Grid</button><button class="${u.view==='list'?'on':''}" data-act="imgView" data-v="list">☰ List</button></div></div></div>
 <div id="img-list">${imgList()}</div>`;}
IN.imgQ=t=>{UI.img.q=t.value;$('#img-list').innerHTML=imgList();};
CH.imgF=t=>{UI.img.folder=t.value;$('#img-list').innerHTML=imgList();};
A.imgView=t=>{UI.img.view=t.dataset.v;render();};
A.uploadImage=()=>$('#img-file').click();
CH.imgFile=t=>{const files=[...t.files];let n=0;files.forEach(f=>{const r=new FileReader();r.onload=()=>{S.images.push({id:uid('img'),name:f.name,folder:'Uncategorized',url:String(r.result),size:Math.max(1,Math.round(f.size/1024))+' KB',dims:'',date:nowISO()});if(++n===files.length){render();toast(n+' image'+(n>1?'s':'')+' uploaded');}};r.readAsDataURL(f);});};
A.imgCopy=t=>copyText(cdn(getImg(t.dataset.id)),'Image link copied');
A.imgRename=t=>{const i=getImg(t.dataset.id);promptBox('Rename image','File name',i.name,v=>{i.name=v;render();});};
A.imgMove=t=>{const i=getImg(t.dataset.id);promptBox('Move to folder','Folder name',i.folder,v=>{i.folder=v;render();toast('Moved');},'Move');};
A.imgDelete=t=>{const i=getImg(t.dataset.id);confirmBox('Delete '+esc(i.name)+'?','Emails that already used this image will show a broken image.','Delete',()=>{S.images=S.images.filter(x=>x.id!==i.id);render();toast('Deleted');});};

/* ================= ANALYTICS ================= */
function anSorted(cs){const u=UI.an;const key={name:c=>c.name.toLowerCase(),date:c=>new Date(c.sendAt).getTime(),rec:c=>c.stats.recipients,open:c=>ratio(c.stats.opens,c.stats.delivered),click:c=>ratio(c.stats.clicks,c.stats.delivered),bounce:c=>c.stats.bounces,unsub:c=>c.stats.unsubs}[u.sort];return cs.slice().sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*u.dir;});}
function anCampaigns(){const u=UI.an;let cs=sentC();if(u.range!=='all')cs=cs.filter(c=>daysAgo(c.sendAt)<=+u.range);if(u.list!=='all')cs=cs.filter(c=>c.listIds.includes(u.list));return cs;}
function vAnalytics(){const u=UI.an;const cs=anCampaigns();const a=aggStats(cs);const ord=cs.slice().sort((x,y)=>new Date(x.sendAt)-new Date(y.sendAt));
 const head=[['name','Campaign'],['date','Sent'],['rec','Recipients'],['open','Open rate'],['click','Click rate'],['bounce','Bounces'],['unsub','Unsubscribes']];
 return `<div class="page-h"><div><h1>Analytics</h1><div class="sub">${cs.length} campaigns in this period</div></div><div class="flex wrap">${sel('anF','range',u.range,[['30','Last 30 days'],['90','Last 90 days'],['365','Last 12 months'],['all','All time']])}${sel('anF','list',u.list,[['all','All audiences'],...S.lists.map(l=>[l.id,l.name])])}<button class="btn" data-act="exportAnalytics">⇩ Export CSV</button></div></div>
 <div class="grid g4 mb">${kpi('Emails sent',num(a.rec),cs.length+' campaigns')}${kpi('Delivery rate',pct(ratio(a.del,a.rec)),num(a.bo)+' bounced')}${kpi('Open rate',pct(a.openRate),num(a.op)+' unique opens')}${kpi('Click rate',pct(a.clickRate,2),num(a.cl)+' unique clicks')}</div>
 <div class="grid mb" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div class="card"><div class="card-h"><h3>Open and click rate by campaign</h3><span class="legend"><span><i style="background:var(--orange)"></i>Open rate</span><span><i style="background:var(--navy-l)"></i>Click rate</span></span></div><div class="card-b">${ord.length?barChart([{name:'Open rate',color:'var(--orange)',vals:ord.map(c=>ratio(c.stats.opens,c.stats.delivered)),fmt:v=>pct(v)},{name:'Click rate',color:'var(--navy-l)',vals:ord.map(c=>ratio(c.stats.clicks,c.stats.delivered)),fmt:v=>pct(v,2)}],ord.map(c=>MONTHS[new Date(c.sendAt).getMonth()]+' '+new Date(c.sendAt).getDate()),{h:200,gap:6}):'<div class="empty">No campaigns in this period.</div>'}<div class="small muted mt">Hover a bar to see the numbers.</div></div></div>
 <div class="card"><div class="card-h"><h3>Sender reputation</h3></div><div class="card-b" style="padding-top:6px;padding-bottom:6px">${healthRows(a)}</div></div></div>
 <div class="card mb"><div class="card-h"><h3>Campaigns</h3></div><div style="overflow:auto"><table class="t"><thead><tr>${head.map(([k,l])=>`<th class="${k==='name'||k==='date'?'':'num'}"><a href="#" data-act="anSort" data-k="${k}" style="color:inherit;text-decoration:none">${l}${u.sort===k?(u.dir<0?' ↓':' ↑'):''}</a></th>`).join('')}</tr></thead><tbody>${anSorted(cs).map(c=>`<tr class="click" data-act="go" data-href="#/report/${c.id}"><td><span class="title-link">${esc(c.name)}</span></td><td class="small">${fmtD(c.sendAt)}</td><td class="num">${num(c.stats.recipients)}</td><td class="num">${pct(ratio(c.stats.opens,c.stats.delivered))}</td><td class="num">${pct(ratio(c.stats.clicks,c.stats.delivered),2)}</td><td class="num">${num(c.stats.bounces)}</td><td class="num">${num(c.stats.unsubs)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No campaigns.</td></tr>'}</tbody></table></div></div>
 <div class="card"><div class="card-h"><h3>Audiences</h3></div><div style="overflow:auto"><table class="t"><thead><tr><th>Audience</th><th class="num">Subscribed</th><th class="num">Campaigns sent</th><th class="num">Avg. open</th><th class="num">Avg. click</th></tr></thead><tbody>${S.lists.map(l=>{const lc=sentC().filter(c=>c.listIds.includes(l.id));const la=aggStats(lc);return `<tr><td>${esc(l.name)}</td><td class="num">${num(l.subs)}</td><td class="num">${lc.length}</td><td class="num">${lc.length?pct(la.openRate):'—'}</td><td class="num">${lc.length?pct(la.clickRate,2):'—'}</td></tr>`;}).join('')}</tbody></table></div></div>`;}
CH.anF=t=>{UI.an[t.dataset.k]=t.value;render();};
A.anSort=t=>{const k=t.dataset.k;if(UI.an.sort===k)UI.an.dir*=-1;else{UI.an.sort=k;UI.an.dir=k==='name'?1:-1;}render();};
A.exportAnalytics=()=>{const cs=anSorted(anCampaigns());download('campaign-analytics.csv',csv([['Campaign','Subject','Sent','Audience','Recipients','Delivered','Unique opens','Open rate','Unique clicks','Click rate','Bounces','Unsubscribes','Complaints'],...cs.map(c=>{const s=c.stats;return [c.name,c.subject,fmtDT(c.sendAt),audLabel(c),s.recipients,s.delivered,s.opens,pct(ratio(s.opens,s.delivered)),s.clicks,pct(ratio(s.clicks,s.delivered),2),s.bounces,s.unsubs,s.complaints];})]));toast('Exported '+cs.length+' campaigns');};

const chk=(t,d)=>`<div class="health"><div><b>${t}</b><div class="small muted">${d}</div></div><span class="badge b-ok">✓ Done</span></div>`;
function vSettings(tab){const tabs=[['senders','Senders'],['sending','Sending domain'],['compliance','Footer & compliance'],['tracking','Tracking'],['users','Users'],['usage','Usage & cost']];let b='';const st=S.settings;
 if(tab==='senders')b=`<div class="card"><div class="card-h"><div><h3>Sender profiles</h3><div class="small muted">Pick one in each campaign’s From step. Any @darkhorsetech.com address works, since the whole domain is verified in Amazon SES.</div></div><button class="btn pri" data-act="addSender">+ Add sender</button></div><table class="t"><thead><tr><th>From name</th><th>From address</th><th>Replies go to</th><th></th><th class="right">Actions</th></tr></thead><tbody>${S.senders.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.email)}</td><td class="small">${esc(s.replyTo)}</td><td>${st.defaultSender===s.id?'<span class="badge b-info">Default</span>':''}</td><td class="right"><div class="flex" style="justify-content:flex-end;gap:4px"><button class="btn sm" data-act="editSender" data-id="${s.id}">Edit</button><div class="menu-wrap"><button class="btn sm ghost" data-act="toggleMenu" aria-label="Sender actions">⋯</button><div class="menu"><button data-act="senderDefault" data-id="${s.id}">Make default</button><button class="danger" data-act="senderDelete" data-id="${s.id}">Delete</button></div></div></div></td></tr>`).join('')}</tbody></table></div>`;
 else if(tab==='sending')b=`<div class="grid g2"><div class="card"><div class="card-h"><h3>darkhorsetech.com</h3><span class="badge b-ok">Verified</span></div><div class="card-b" style="padding-top:6px;padding-bottom:6px">${chk('Domain verified in Amazon SES','Verified November 20, 2026')}${chk('DKIM signing','3 CNAME records in GoDaddy · status Successful')}${chk('Custom bounce domain','bounce.darkhorsetech.com · MX and SPF records')}${chk('SPF','Main domain record left unchanged')}${chk('DMARC','Existing record, p=none (monitoring)')}</div></div>
 <div class="card"><div class="card-h"><h3>Amazon SES account</h3><span class="badge b-ok">Production</span></div><div class="card-b kv"><div>Region</div><div>US East (Ohio) · us-east-2</div><div>Daily sending limit</div><div>${num(st.dailyQuota)} emails per 24 hours</div><div>Sending speed</div><div>${st.rate} emails per second</div><div>Pricing plan</div><div>Essentials · $0.16 per 1,000 emails</div></div></div></div>
 <div class="notice mt">At ${st.rate} emails a second, a 20,000-contact campaign finishes in about ${Math.ceil(20000/st.rate/60)} minutes.</div>`;
 else if(tab==='compliance')b=`<div class="card" style="max-width:760px"><div class="card-b"><div class="field"><label for="st-company">Company name</label><input type="text" id="st-company" value="${esc(st.company)}"></div><div class="field"><label for="st-addr">Mailing address for the email footer</label><input type="text" id="st-addr" value="${esc(st.footerAddress)}"><div class="hint">Required by the CAN-SPAM Act on every marketing email: a valid street address or PO box.</div></div><div class="field"><label for="st-rem">Default “how you signed up” line</label><input type="text" id="st-rem" value="${esc(st.reminder)}"><div class="hint">Shown above the address in every footer. Each list can override it.</div></div><label class="switch"><input type="checkbox" id="st-perm" ${st.requirePermission?'checked':''}><div><b>Ask for permission confirmation before every send</b><span>A checkbox in the send step: “Everyone in this audience asked to hear from Darkhorse Tech.”</span></div></label><div class="notice" style="margin:4px 0 16px">Every email automatically gets an unsubscribe link and Gmail’s one-click unsubscribe header. Unsubscribes take effect immediately.</div><button class="btn pri" data-act="saveCompliance">Save</button></div></div>`;
 else if(tab==='tracking')b=`<div class="card" style="max-width:760px"><div class="card-b"><p class="muted" style="margin-top:0">Defaults for new campaigns. You can change them per campaign under Settings & tracking.</p><label class="switch"><input type="checkbox" id="st-to" ${st.trackOpens?'checked':''}><div><b>Track opens</b><span>Apple Mail opens emails automatically, so open rates run high.</span></div></label><label class="switch"><input type="checkbox" id="st-tc" ${st.trackClicks?'checked':''}><div><b>Track clicks</b><span>The most reliable engagement number.</span></div></label><label class="switch"><input type="checkbox" id="st-tp" ${st.trackPlain?'checked':''}><div><b>Track clicks in plain-text versions</b><span>Off by default, because tracking links look odd in plain text.</span></div></label><button class="btn pri" data-act="saveTracking">Save</button></div></div>`;
 else if(tab==='users')b=`<div class="card"><div class="card-h"><h3>Who can use PaunchPost</h3><button class="btn pri" data-act="inviteUser">+ Give someone access</button></div><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${S.users.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td><span class="badge ${x.status==='Active'?'b-ok':'b-warn'}">${esc(x.status)}</span></td></tr>`).join('')}</tbody></table></div><div class="small muted mt">Everyone signs in with the shared PaunchPost login for now. Microsoft 365 sign-in is next.</div>`;
 else{const now=new Date();const month=sentC().filter(c=>{const d=new Date(c.sendAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});const sends=month.reduce((s,c)=>s+c.stats.recipients,0);const cost=sends/1000*st.costPer1000;const year=sentC().filter(c=>daysAgo(c.sendAt)<=365).reduce((s,c)=>s+c.stats.recipients,0);const yCost=year/1000*st.costPer1000;

  <div class="card" style="max-width:760px"><div class="card-h"><h3>Sending limit</h3></div><div class="card-b"><div class="flex between small"><span>Largest single day in the last 12 months</span><b>${num(Math.max(0,...sentC().map(c=>c.stats.recipients)))} of ${num(st.dailyQuota)}</b></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,Math.max(0,...sentC().map(c=>c.stats.recipients))/st.dailyQuota*100)}%"></i></div><div class="small muted mt">Amazon raises the limit automatically as your sending history grows.</div></div></div>`;}
 return `<div class="page-h"><div><h1>Settings</h1></div></div><div class="tabs">${tabs.map(([k,l])=>`<a href="#/settings/${k}" class="${tab===k?'on':''}">${l}</a>`).join('')}</div>${b}`;}

/* ---- saving campaigns ---- */
const PEND={};
function touch(c){c.editedAt=nowISO();if(c.html!==undefined)HTML[c.sid]=c.html;if(PEND[c.id])clearTimeout(PEND[c.id].t);PEND[c.id]={c,t:setTimeout(()=>saveNow(c.id),700)};}
async function saveNow(id){const p=PEND[id];if(!p)return;clearTimeout(p.t);delete PEND[id];const c=p.c;
 const patch={name:c.name,subject:c.subject,preview:c.preview,plain:c.plain,senderId:c.senderId?idn(c.senderId):null,templateId:c.templateId?idn(c.templateId):null,trackOpens:!!c.tracking.opens,trackClicks:!!c.tracking.clicks,audience:audOut(c)};
 if(c.html!==undefined)patch.html=c.html;
 if(c.status==='draft')patch.sendAt=c.schedule.mode==='later'&&c.schedule.date?new Date(c.schedule.date+'T'+(c.schedule.time||'12:00')).toISOString():null;
 else if(c.status==='scheduled'&&c.sendAt)patch.sendAt=c.sendAt;
 try{await rpc('updateCampaign',{id:c.sid,patch});}catch(e){toast('Couldn’t save: '+e.message);}}
async function flushSaves(){await Promise.all(Object.keys(PEND).map(saveNow));}
const _reload=reload;
reload=async function(){await flushSaves();return _reload();};
srv=async function(action,args,msg){try{await flushSaves();const r=await rpc(action,args);await reload();render();if(msg)toast(typeof msg==='function'?msg(r):msg);return r;}catch(e){toast(e.message);return null;}};
window.addEventListener('beforeunload',e=>{if(Object.keys(PEND).length){flushSaves();e.preventDefault();e.returnValue='';}});

const HTML_P={};
function ensureHtml(c){if(!c||c.html!==undefined)return true;if(!HTML_P[c.sid]){HTML_P[c.sid]=1;rpc('getCampaign',{id:c.sid}).then(d=>{HTML[c.sid]=d.html||'';const x=getC('cm'+c.sid);if(x)x.html=HTML[c.sid];delete HTML_P[c.sid];softRender();}).catch(e=>{delete HTML_P[c.sid];toast(e.message);});}return false;}
async function loadHtml(c){if(c&&c.html===undefined){const d=await rpc('getCampaign',{id:c.sid});HTML[c.sid]=c.html=d.html||'';}}

/* ---- audiences ---- */
function audNames(c){if(c.nonOpenersOf){const o=getC(c.nonOpenersOf);return 'People who didn’t open “'+(o?o.name:'?')+'”';}
 const names=[...c.listIds.map(l=>(getL(l)||{}).name||'Deleted audience'),...c.tagIds.map(t=>'Tag: '+t),...c.segmentIds.map(s=>'Segment: '+((getSeg(s)||{}).name||'deleted'))];
 return names.join(', ')+(names.length&&c.excludeIds.length?' · excluding '+c.excludeIds.map(exLabel).join(', '):'');}
function audienceOf(c){if(!c.nonOpenersOf&&!(c.listIds.length||c.tagIds.length||c.segmentIds.length))return {est:0,label:'No recipients chosen yet'};
 const n=audCount(c);return {est:n==null?0:n,label:audNames(c),loading:n==null};}
function audLabel(c){if(c.audience)return c.audience;return audNames(c)||(c.status==='sent'?'—':'No recipients chosen yet');}

/* ---- reports ---- */
const REP={};
const repKey=c=>c.sid+'|'+(c.imported?'':UI.rep.status);
function repData(c){const k=repKey(c);if(REP[k])return REP[k];if(!REP['p'+k]){REP['p'+k]=1;rpc('report',{id:c.sid,recipients:UI.rep.status}).then(d=>{REP[k]=d;delete REP['p'+k];softRender();}).catch(e=>{delete REP['p'+k];toast(e.message);});}return null;}
function linkStats(c){return ((repData(c)||{}).links||[]).map(l=>({url:l.url,total:l.total||0,unique:l.unique||0}));}
function hourly(c){const ser=(repData(c)||{}).series||[];const lab=ser.map(x=>{const t=new Date(String(x.t).replace(' ','T'));let h=t.getHours();if(isNaN(h))return '';const ap=h>=12?'pm':'am';h=h%12||12;return h+ap;});return {labels:lab,opens:ser.map(x=>x.o||0),clicks:ser.map(x=>x.c||0)};}
let SENDING_T=null;
function vReport(id,tab){const c=getC(id);if(!c)return notFound('Report');if(c.status!=='sent')return vReport0(id,tab);
 const d=repData(c);const okHtml=ensureHtml(c);if(!d||!okHtml)return LOADING;
 let h=vReport0(id,tab);
 if(c.sending){h=`<div class="notice">Sending now: ${num(c.stats.recipients)} sent${c.stats.queued?' and '+num(c.stats.queued)+' to go':''}. This page updates by itself.</div>`+h;
  clearTimeout(SENDING_T);SENDING_T=setTimeout(async()=>{const r=route();if(r[0]!=='report'||r[1]!==id)return;Object.keys(REP).forEach(k=>delete REP[k]);try{await reload();}catch(e){}softRender();},6000);}
 if(!c.imported&&c.stats&&c.stats.failed)h=h.replace('<div class="tabs no-print">',`<div class="notice warn">${num(c.stats.failed)} emails couldn’t be sent. See Recipient activity, filtered to Failed.</div><div class="tabs no-print">`);
 return h;}
function repRecipients(c){if(c.imported)return repRecipients0(c);const d=repData(c);if(!d)return LOADING;const st=UI.rep.status;const rows=d.recipients||[];
 const badge=o=>o.status==='bounced'?'<span class="badge b-bad">Bounced</span>':o.status==='complained'?'<span class="badge b-bad">Spam complaint</span>':o.status==='failed'?'<span class="badge b-bad">Failed</span>':o.status==='skipped'?'<span class="badge b-draft">Skipped</span>':o.unsubscribed_at?'<span class="badge b-unsub">Unsubscribed</span>':o.clicked_at?'<span class="badge b-ok">Clicked</span>':o.opened_at?'<span class="badge b-info">Opened</span>':'<span class="badge b-draft">Didn’t open</span>';
 return `<div class="card"><div class="toolbar"><label class="small muted" for="rs-st">Show</label>${sel('repStatus','status',st,[['sent','Everyone sent'],['opened','Opened'],['notopened','Didn’t open'],['clicked','Clicked'],['bounced','Bounced'],['unsubscribed','Unsubscribed'],['complaints','Spam complaints'],['failed','Failed']],'id="rs-st"')}<span class="small muted">${num(rows.length)}${rows.length>=2000?'+':''} of ${num(d.recipientTotal)} recipients</span><div class="flex" style="margin-left:auto">${['opened','notopened','clicked','sent'].includes(st)?`<button class="btn sm" data-act="segFromRecip" data-id="${c.id}">Save as segment</button>`:''}<button class="btn sm" data-act="exportRecip" data-id="${c.id}">⇩ Export</button></div></div>
 ${rows.length?`<div style="overflow:auto"><table class="t"><thead><tr><th>Email</th><th>Name</th><th>Practice</th><th class="num">Opens</th><th class="num">Clicks</th><th>Status</th></tr></thead><tbody>${rows.map(o=>`<tr ${o.contact_id?`class="click" data-act="openContact" data-id="c${o.contact_id}"`:''}><td>${esc(o.email)}</td><td>${esc((o.first+' '+o.last).trim())}</td><td class="small">${esc(o.practice)}</td><td class="num">${num(o.open_count)}</td><td class="num">${num(o.click_count)}</td><td>${badge(o)}${o.error?`<div class="small muted">${esc(o.error)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nobody in this group.</div>'}</div>`;}
function repDeliv(c){const s=c.stats;if(c.imported)return repDeliv0(c);const d=repData(c);if(!d)return LOADING;
 return `<div class="grid g4 mb">${kpi('Delivered',num(s.delivered),pct(ratio(s.delivered,s.recipients))+' of emails sent')}${kpi('Bounces',num(s.bounces),'Added to the suppression list')}${kpi('Couldn’t send',num(s.failed||0),'Amazon SES refused these')}${kpi('Spam complaints',num(s.complaints),'Suppressed right away')}</div>
 <div class="card"><div class="card-h"><h3>Results by email domain</h3><span class="small muted">Top 15</span></div><div style="overflow:auto"><table class="t"><thead><tr><th>Domain</th><th class="num">Sent</th><th class="num">Bounced</th><th class="num">Open rate</th><th class="num">Click rate</th></tr></thead><tbody>${(d.domains||[]).map(x=>`<tr><td>${esc(x.d)}</td><td class="num">${num(x.n)}</td><td class="num">${num(x.b)}</td><td class="num">${pct(ratio(x.o,x.n-x.b))}</td><td class="num">${pct(ratio(x.cl,x.n-x.b),2)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing delivered yet.</td></tr>'}</tbody></table></div></div>
 <div class="small muted mt">Bounces and spam complaints come from Amazon SES’s feed and are suppressed automatically.</div>`;}

async function makeDraft(name,from,patch,open){await flushSaves();let r;try{r=await rpc('createCampaign',{name,from});if(patch&&Object.keys(patch).length)await rpc('updateCampaign',{id:r.id,patch});await reload();}catch(e){toast(e.message);return;}UI.build.open=open||'to';nav('#/campaign/cm'+r.id);}
const fromOf=f=>f.startsWith('t:')?'t:'+idn(f.slice(2)):f.startsWith('c:')?'c:'+idn(f.slice(2)):'html:'+BLANK();
A.ncGo=()=>{const name=$('#nc-name').value.trim()||'Untitled';const f=$('#nc-from').value;const day=NC_DAY;NC_DAY=null;closeModal();makeDraft(name,fromOf(f),day?{sendAt:new Date(day+'T12:00').toISOString()}:null,'to');};

function calMove(id,day){const c=getC(id);if(!c||c.status==='sent')return;if(day<todayYmd()){toast('That day has already passed');return;}
 const time=c.schedule.time||'12:00';const when=new Date(day+'T'+time);
 if(c.status==='scheduled'){if(when<=new Date()){toast('That time has already passed today. Open the campaign to pick a later time');return;}c.schedule={mode:'later',date:day,time};c.sendAt=when.toISOString();touch(c);render();saveNow(c.id).then(()=>toast('Rescheduled to '+fmtDT(c.sendAt)));}
 else{c.schedule={mode:'later',date:day,time};touch(c);render();toast('Planned for '+fmtD(day+'T12:00')+'. Still a draft until you schedule it');}}

const saveFields=()=>rpc('saveSettings',{patch:{fields:S.fields}}).catch(e=>toast('Couldn’t save fields: '+e.message));
function addField(label){let tag=String(label).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'field';const taken=new Set(['first_name','last_name','email','practice','title','phone','company','unsubscribe_url','view_in_browser_url',...S.fields.map(f=>f.tag)]);let t=tag,n=2;while(taken.has(t))t=tag+'_'+(n++);const f={tag:t,label:String(label).trim()||t};S.fields.push(f);saveFields();return f;}

/* ---- merge tags in previews: same rules as the sender (fallbacks, unknown tags dropped) ---- */
function merge(html,x){x=x||sampleContact();const map={email:x.email,first_name:x.first,last_name:x.last,practice:x.practice,title:x.title||'',phone:x.phone||'',...(x.custom||{})};const links={unsubscribe_url:'#unsubscribe',view_in_browser_url:'#view-in-browser'};
 return String(html).replace(/\{\{\s*([a-z0-9_]+)\s*(?:\|\s*([^}]*?)\s*)?\}\}/gi,(m,key,fb)=>{const k=key.toLowerCase();if(k in links)return links[k];if(k in map)return esc(map[k]||fb||'');return fb!=null?esc(fb):(S.fields.some(f=>f.tag===k)?'':m);});}

const vReport1=vReport;
vReport=function(id,tab){let h=vReport1(id,tab);const c=getC(id);
 if(c&&c.pausedReason)h=`<div class="notice warn" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:260px"><b>Sending is paused.</b> ${esc(c.pausedReason)} ${num(c.stats.queued||0)} emails are still waiting. Nothing more goes out until you decide.</div><button class="btn" data-act="stopCampaign" data-id="${c.id}">Stop for good</button><button class="btn pri" data-act="resumeCampaign" data-id="${c.id}">Resume sending</button></div>`+h;
 return h;};
A.resumeCampaign=t=>{const c=getC(t.dataset.id);confirmBox('Resume sending “'+esc(c.name)+'”?','Only resume if you’ve checked why it paused, for example a bad batch of addresses that you’ve since removed. If it trips the safety check again it pauses again.','Resume',async()=>{Object.keys(REP).forEach(k=>delete REP[k]);await srv('resumeCampaign',{id:c.sid},'Sending resumed');});};
A.stopCampaign=t=>{const c=getC(t.dataset.id);confirmBox('Stop “'+esc(c.name)+'” for good?','Emails already sent stay sent. Everyone still waiting is skipped and the campaign is marked finished.','Stop sending',async()=>{Object.keys(REP).forEach(k=>delete REP[k]);await srv('stopCampaign',{id:c.sid},'Stopped. Nobody else will get it');});};

const sendFlow0=A.sendFlow;

 await flushSaves();let r;try{r=await rpc('spamCheck',{id:c.sid});}catch(e){toast(e.message);return;}
 if(r.problems.length){modal({title:'Not ready to send yet',body:`<div class="notice warn" style="margin-top:0">PaunchPost won’t send this until these are fixed:</div><ul style="line-height:1.6;padding-left:20px">${r.problems.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`,foot:`<button class="btn" data-act="closeModal">Close</button><button class="btn pri" data-act="closeModalGo" data-href="#/config-sending">Open sending settings</button>`});return;}
 sendFlow0(t);

 else{const b=$('#modal-root .modal-b');if(b)b.insertAdjacentHTML('afterbegin','<div class="notice ok" style="margin-top:0">Spam check passed: nothing in the subject, content or links that filters usually flag.</div>');}};

  <div class="flex wrap mt" style="gap:12px"><label class="small">Per campaign<br><input type="number" id="lim-c" min="1" max="50000" value="${L.maxPerCampaign}" style="width:110px"></label><label class="small">Per 24 hours<br><input type="number" id="lim-d" min="1" max="50000" value="${L.maxPerDay}" style="width:110px"></label><label class="small">Emails per second<br><input type="number" id="lim-r" min="1" max="13" value="${L.sendRate}" style="width:90px"></label><button class="btn" data-act="saveLimits" style="align-self:flex-end">Save limits</button></div></div></div>

const gsClear=()=>{$('#gres').innerHTML='';$('#gsearch').value='';};
A.gsGo=t=>{const h=t.getAttribute('href');gsClear();nav(h);};
A.gsContact=t=>{gsClear();openContact(t.dataset.id);};

/* ================= events ================= */
A.toggleMenu=t=>{const m=t.nextElementSibling;const was=m.classList.contains('open');closeMenus();if(was)return;m.classList.add('open');const r=t.getBoundingClientRect();const w=m.offsetWidth,h=m.offsetHeight;let top=r.bottom+4;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-4);let left=r.right-w;if(left<8)left=Math.min(r.left,innerWidth-w-8);m.style.top=top+'px';m.style.left=left+'px';};
A.closeModal=()=>closeModal();
A.bgClose=(t,e)=>{if(e.target===t)closeModal();};
document.addEventListener('click',e=>{
 if(!e.target.closest('.search'))$('#gres').innerHTML='';
 const t=e.target.closest('[data-act]');
 if(!e.target.closest('.menu-wrap'))closeMenus();
 if(!t){const l=e.target.closest('a[href^="#/"]');if(l){e.preventDefault();closeModal();nav(l.getAttribute('href'));}return;}
 const fn=A[t.dataset.act];if(!fn)return;
 if(t.tagName==='A')e.preventDefault();
 const inMenu=!!t.closest('.menu');
 fn(t,e);
 if(inMenu)closeMenus();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in&&IN[t.dataset.in])IN[t.dataset.in](t,e);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ch&&CH[t.dataset.ch])CH[t.dataset.ch](t,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($$('.menu.open').length)closeMenus();else if($('#modal-root').innerHTML)closeModal();else if($('#gres').innerHTML)gsClear();}});
$('#view').addEventListener('scroll',closeMenus,{passive:true});
window.addEventListener('resize',closeMenus);
window.addEventListener('hashchange',()=>{const h=decR(location.hash)||'home';if(h!==CUR){CUR=h;render();}});
CUR=decR(location.hash)||'home';
(async()=>{const v=$('#view');v.innerHTML=`<div class="empty" style="padding:90px 20px"><img src="${LOGO}" alt="PaunchPost" style="width:340px;max-width:80%;border-radius:14px;background:#fff;box-shadow:var(--shadow)"><div style="margin-top:14px;font-weight:600;color:var(--text)">Loading PaunchPost…</div></div>`;
 try{await reload();}catch(e){v.innerHTML=`<div class="notice err" style="margin:40px">PaunchPost couldn’t load: ${esc(e.message)}. ${e.needsSetup?'<a href="/status">Set up the database</a>':'Try reloading the page.'}</div>`;return;}
 render();loadExtras().then(()=>{if(['campaign','contacts'].includes(route()[0]))softRender();});
 setInterval(async()=>{if(document.hidden||Object.keys(PEND).length||$('#modal-root').innerHTML)return;const busy=S.campaigns.some(c=>c.sending||(c.status==='scheduled'&&new Date(c.sendAt)<new Date(Date.now()+60e3)));if(!busy)return;try{await reload();softRender();}catch(e){}},20000);
})();
})();

</script>
</body>
</html>
