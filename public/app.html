<style>
:root{
 --navy:#2b1e5c;--navy-d:#1c1340;--navy-l:#4a3a8c;--orange:#e8933a;
 --bg:#f5f4f9;--card:#fff;--line:#e4e1ee;--text:#1f1a33;--muted:#6b6584;--soft:#efedf6;
 --green:#1f9d6b;--green-bg:#e3f5ec;--red:#c9433a;--red-bg:#fbe9e7;--amber:#a86c12;--amber-bg:#fdf3e2;--blue:#3a67d6;--blue-bg:#e8eefc;
 --radius:10px;--shadow:0 1px 2px rgba(28,19,64,.06),0 2px 8px rgba(28,19,64,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{color:var(--navy-l)}
button{font:inherit}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:var(--navy-d);color:#cfc8ea;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:16px}
.brand .logo-cat{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--orange),#f4b56d);display:grid;place-items:center;color:var(--navy-d);font-weight:800;font-size:13px}
.brand small{display:block;font-weight:500;font-size:11px;color:#9d93c7}
.create-btn{margin:4px 14px 12px;background:var(--orange);color:var(--navy-d);border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer;text-align:left}
.create-btn:hover{background:#f2a352}
.nav{padding:0 8px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:#cfc8ea;text-decoration:none;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(232,147,58,.18);color:#fff}
.nav a.sub{padding-left:38px;font-size:13px}
.nav .ico{width:18px;text-align:center;opacity:.85}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7d73a9;padding:14px 10px 6px}
.nav a.off{opacity:.45;cursor:not-allowed}
.side-foot{margin-top:auto;padding:14px 18px;font-size:12px;color:#8f86b8;border-top:1px solid rgba(255,255,255,.07);line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search .s-ico{position:absolute;left:11px;top:7px;color:var(--muted)}
.search-res{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(28,19,64,.14);z-index:60;max-height:380px;overflow:auto;padding:4px}
.search-res a{display:block;padding:8px 10px;text-decoration:none;color:var(--text);border-radius:6px}
.search-res a:hover{background:var(--soft)}
.search-res .grp{font-size:11px;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px;letter-spacing:.05em}
.proto{font-size:12px;background:var(--amber-bg);color:var(--amber);padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}

.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

.health{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}

(function(){
'use strict';

/* ================= utilities ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en-US');
const pct=(x,d=1)=>((isFinite(x)?x:0)*100).toFixed(d)+'%';
const ratio=(a,b)=>b?a/b:0;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtD=iso=>{if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();};
const fmtT=iso=>{const d=new Date(iso);let h=d.getHours();const m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap;};
const fmtDT=iso=>iso?fmtD(iso)+' · '+fmtT(iso):'—';
const nowISO=()=>new Date().toISOString();
const daysAgo=iso=>(Date.now()-new Date(iso).getTime())/864e5;
let _id=1000;const uid=p=>p+(++_id);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(20261120);
const pick=a=>a[Math.floor(R()*a.length)];
const hashStr=s=>{let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
const fileSlug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'export';
const EMAIL_RE=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');}

function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','||c==='\t'){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}}if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(v=>v.trim()!==''));}

async function rpc(action,args){
 const r=await fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({action},args||{}))});
 let j=null;try{j=await r.json();}catch(e){}
 if(r.status===401){location.reload();throw new Error('Please sign in again');}
 if(!r.ok)throw new Error((j&&j.error)||('Server error '+r.status));
 return j;}
/** Run a change on the server, reload everything, then toast. Returns the result, or null if it failed. */
async function srv(action,args,msg){try{const r=await rpc(action,args);await reload();if(msg)toast(typeof msg==='function'?msg(r):msg);return r;}catch(e){toast(e.message);return null;}}

  excludeIds:[...(ex.listIds||[]).map(x=>'l'+x),...(ex.segmentIds||[]).map(x=>'sg'+x),...(ex.tags||[]).map(t=>'t:'+t)],

 S.tagCounts={};d.tags.forEach(t=>{S.tagCounts[t.tag]=t;});
 S.localTags=S.localTags.filter(t=>!S.tagCounts[t]);

 S.totals=d.totals;
 AUD={};SEGC={};LOADED=true;
}

function aggStats(cs){const t={rec:0,del:0,op:0,cl:0,bo:0,un:0,co:0};cs.forEach(c=>{const s=c.stats;if(!s)return;t.rec+=s.recipients;t.del+=s.delivered;t.op+=s.opens;t.cl+=s.clicks;t.bo+=s.bounces;t.un+=s.unsubs;t.co+=s.complaints;});t.openRate=ratio(t.op,t.del);t.clickRate=ratio(t.cl,t.del);t.bounceRate=ratio(t.bo,t.rec);t.unsubRate=ratio(t.un,t.del);t.compRate=ratio(t.co,t.del);return t;}
function linksFromHtml(h){const out=[];const re=/href\s*=\s*"([^"]+)"/gi;let m;while((m=re.exec(h||''))){const u=m[1];if(/^\{\{|^#|^mailto:/i.test(u))continue;if(!out.includes(u))out.push(u);}return out;}
function linkStats(c){if(c.links)return c.links.map(l=>({url:l.url,total:l.clicks,unique:l.clicks}));const urls=linksFromHtml(c.html);const s=c.stats||{clicks:0,totalClicks:0};return urls.map((u,i)=>{const share=i===0?(urls.length>1?.9:1):(.1/(urls.length-1));return {url:u,unique:Math.round(s.clicks*share),total:Math.round(s.totalClicks*share)};});}
function hourly(c){if(c.series&&c.series.length){const lab=c.series.map(x=>{const d=new Date(String(x.t).replace(' ','T'));let h=d.getHours();if(isNaN(h))return '';const ap=h>=12?'pm':'am';h=h%12||12;return h+ap;});return {labels:lab,opens:c.series.map(x=>x.o||0),clicks:c.series.map(x=>x.c||0)};}const s=c.stats;const st=new Date(c.sendAt);const sum=HW.reduce((a,b)=>a+b,0);const labels=HW.map((_,i)=>{const d=new Date(st.getTime()+i*3600e3);let h=d.getHours();const ap=h>=12?'pm':'am';h=h%12||12;return h+ap;});return {labels,opens:HW.map(w=>Math.round(s.totalOpens*w/sum)),clicks:HW.map(w=>Math.round(s.totalClicks*w/sum))};}
function htmlToText(h){return String(h).replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<title[\s\S]*?<\/title>/gi,'').replace(/<a [^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi,(m,u,t)=>t.replace(/<[^>]+>/g,'').trim()+' ('+u+')').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|h[1-6]|li|tr|div)>/gi,'\n').replace(/<li[^>]*>/gi,'• ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();}

let NC_DAY=null,after=[],lastHash='',CUR='home';
const encR=h=>h.replace(/^settings/,'config').split('/').join('-');
const decR=h=>{h=String(h||'').replace(/^#\/?/,'');if(h.includes('/'))return h;const a=h.split('-');if(a[0]==='config')a[0]='settings';return a.join('/');};
function nav(h){CUR=String(h||'').replace(/^#\/?/,'')||'home';try{if(decR(location.hash)!==CUR)location.hash=encR(CUR);}catch(e){}render();}

/* ================= shell ================= */
function route(){return (CUR||'home').split('/');}
function render(){
 closeMenus();
 const [p,a,b]=route();after=[];let html='';
 try{
  switch(p){
   case 'home':html=vHome();break;
   case 'campaigns':html=vCampaigns();break;
   case 'calendar':html=vCalendar();break;
   case 'fields':html=vFields();break;
   case 'campaign':html=vBuilder(a);break;
   case 'report':html=vReport(a,b||'overview');break;
   case 'contacts':html=vContacts();break;
   case 'lists':html=vLists();break;
   case 'tags':html=vTags();break;
   case 'segments':html=vSegments();break;
   case 'suppression':html=vSuppression();break;
   case 'imports':html=vImports();break;
   case 'templates':html=vTemplates();break;
   case 'template':html=vTemplateEditor(a);break;
   case 'content':html=vContent();break;
   case 'analytics':html=vAnalytics();break;
   case 'settings':html=vSettings(a||'senders');break;
   default:html=vHome();
  }
 }catch(err){console.error(err);html='<div class="notice err">Something went wrong showing this page: '+esc(err.message)+'</div>';}
 const v=$('#view');v.innerHTML=html;renderNav(p);after.forEach(f=>f());
 if(CUR!==lastHash){v.scrollTop=0;lastHash=CUR;}
}
function renderNav(p){
 const grp={campaign:'campaigns',report:'campaigns',calendar:'campaigns',templates:'campaigns',template:'campaigns',lists:'contacts',tags:'contacts',segments:'contacts',suppression:'contacts',imports:'contacts',fields:'contacts'};
 const cur=grp[p]||p;const sp={template:'templates',campaign:'campaigns',report:'campaigns'}[p]||p;
 const L=(k,i,t)=>`<a href="#/${k}" class="${k===cur?'on':''}"><span class="ico">${i}</span>${t}</a>`;
 const SUB=items=>items.map(([k,t])=>`<a href="#/${k}" class="sub ${k===sp?'on':''}">${t}</a>`).join('');
 let h=L('home','⌂','Home')+L('campaigns','✉','Campaigns');
 if(cur==='campaigns')h+=SUB([['campaigns','All campaigns'],['calendar','Calendar'],['templates','Email templates']]);
 h+=L('contacts','☺','Audience');
 if(cur==='contacts')h+=SUB([['contacts','All contacts'],['lists','Audiences'],['tags','Tags'],['segments','Segments'],['suppression','Unsubscribes & bounces'],['imports','Import history'],['fields','Fields & merge tags']]);
 h+=L('analytics','▥','Analytics')+L('content','▣','Images')+L('settings','⚙','Settings');
 h+=`<div class="nav-label">Later phases</div><a class="off" title="Not in version 1"><span class="ico">↻</span>Automations</a><a class="off" title="Not in version 1"><span class="ico">▭</span>Signup forms</a>`;
 $('#nav').innerHTML=h;
}
function closeMenus(){$$('.menu.open').forEach(m=>m.classList.remove('open'));}
let toastT;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none';},3000);}
function modal(o){const root=$('#modal-root');root.innerHTML=`<div class="modal-bg" data-act="bgClose"><div class="modal ${o.wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${o.title}</h3><button class="x" data-act="closeModal" aria-label="Close">×</button></div><div class="modal-b">${o.body}</div>${o.foot===false?'':`<div class="modal-f">${o.foot||'<button class="btn" data-act="closeModal">Close</button>'}</div>`}</div></div>`;if(o.mount)o.mount();}
function closeModal(){$('#modal-root').innerHTML='';}
function confirmBox(title,msg,okLabel,onOk,danger){modal({title,body:`<p style="margin:0;line-height:1.55">${msg}</p>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn ${danger===false?'pri':'danger'}" data-act="confirmOk">${okLabel}</button>`});A.confirmOk=()=>{closeModal();onOk();};}
function promptBox(title,label,val,onOk,okLabel){modal({title,body:`<div class="field"><label for="pb">${label}</label><input type="text" id="pb" value="${esc(val)}"></div>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="promptOk">${okLabel||'Save'}</button>`,mount:()=>{const i=$('#pb');i.focus();i.select();i.addEventListener('keydown',e=>{if(e.key==='Enter')A.promptOk();});}});A.promptOk=()=>{const v=$('#pb').value.trim();if(!v)return;closeModal();onOk(v);};}
const kpi=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`;
const mini=(l,v)=>`<div><div class="small muted">${l}</div><div style="font-weight:700;font-size:18px;margin-top:2px">${v}</div></div>`;
const sel=(h,k,v,opts,extra)=>`<select data-ch="${h}" data-k="${k}" ${extra||''}>${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const notFound=w=>`<div class="notice warn">${w} not found. It may have been deleted. <a href="#/home">Go home</a></div>`;
function barChart(series,labels,opt){opt=opt||{};const max=Math.max(1e-9,...series.flatMap(s=>s.vals));const gap=opt.gap||4;
 return `<div style="display:flex;align-items:flex-end;gap:${gap}px;height:${opt.h||170}px;border-bottom:1px solid var(--line)">${labels.map((l,i)=>`<div style="flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;min-width:0" title="${esc(l)}: ${esc(series.map(s=>s.name+' '+(s.fmt?s.fmt(s.vals[i]):s.vals[i])).join(', '))}">${series.map(s=>`<div style="flex:1;background:${s.color};border-radius:3px 3px 0 0;height:${s.vals[i]>0?Math.max(1.5,s.vals[i]/max*100):0}%"></div>`).join('')}</div>`).join('')}</div>
 <div style="display:flex;gap:${gap}px;margin-top:6px">${labels.map((l,i)=>`<div class="small muted" style="flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0">${(opt.every&&i%opt.every)?'':esc(l)}</div>`).join('')}</div>`;}
function healthRows(a){const row=(n,v,good,warn,note)=>{const st=v<=good?['Healthy','b-ok']:v<=warn?['Watch','b-warn']:['At risk','b-bad'];return `<div class="health"><div><b>${n}</b><div class="small muted">${note}</div></div><div class="right"><div style="font-weight:700">${pct(v,2)}</div><span class="badge ${st[1]}">${st[0]}</span></div></div>`;};
 return row('Bounce rate',a.bounceRate,.02,.05,'Amazon reviews accounts above 5%')+row('Spam complaints',a.compRate,.0005,.001,'Amazon reviews accounts above 0.1%')+row('Unsubscribe rate',a.unsubRate,.005,.01,'Under 0.5% is typical');}

/* ================= HOME ================= */
function vHome(){
 const hr=new Date().getHours();const greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
 const last30=sentC().filter(c=>daysAgo(c.sendAt)<=30);const a=aggStats(last30);
 const now=new Date();const month=sentC().filter(c=>{const d=new Date(c.sendAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
 const mSends=month.reduce((s,c)=>s+c.stats.recipients,0);const cost=mSends/1000*S.settings.costPer1000;
 const sched=S.campaigns.filter(c=>c.status==='scheduled').sort((x,y)=>new Date(x.sendAt)-new Date(y.sendAt));
 const drafts=S.campaigns.filter(c=>c.status==='draft').sort(byDateDesc).slice(0,4);
 const recent=sentC().sort(byDateDesc).slice(0,6);
 return `<div class="page-h"><div><h1>${greet}, Noah</h1><div class="sub">Here’s how Darkhorse Tech’s email is doing.</div></div>
 <div class="flex wrap"><button class="btn" data-act="newList">☺ Create audience</button><button class="btn" data-act="importContacts">⇪ Import contacts</button><button class="btn" data-act="newTemplate">▤ New template</button><button class="btn pri" data-act="newCampaign">+ Create campaign</button></div></div>
 <div class="grid g4 mb">${kpi('Emails sent · 30 days',num(a.rec),last30.length+' campaigns')}${kpi('Open rate · 30 days',pct(a.openRate),'Dental industry average: 23.8%')}${kpi('Click rate · 30 days',pct(a.clickRate,2),num(a.cl)+' people clicked')}${kpi('Sending cost this month','$'+cost.toFixed(2),num(mSends)+' emails · Mailchimp was $'+S.settings.mailchimpMonthly+'/mo')}</div>
 <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
  <div class="card" style="align-self:start"><div class="card-h"><h3>Recent campaigns</h3><a href="#/campaigns" class="small">View all</a></div>${miniCampTable(recent)}</div>
  <div class="grid" style="align-content:start">
   <div class="card"><div class="card-h"><h3>Scheduled</h3></div><div class="card-b" style="padding-top:6px;padding-bottom:6px">${sched.length?sched.map(c=>`<div class="health"><div><a class="title-link" href="#/campaign/${c.id}">${esc(c.name)}</a><div class="small muted">${fmtDT(c.sendAt)} · ≈${num(audienceOf(c).est)} recipients</div></div></div>`).join(''):'<div class="muted small" style="padding:10px 0">Nothing scheduled.</div>'}</div></div>
   <div class="card"><div class="card-h"><h3>Drafts</h3></div><div class="card-b" style="padding-top:6px;padding-bottom:6px">${drafts.length?drafts.map(c=>`<div class="health"><div><a class="title-link" href="#/campaign/${c.id}">${esc(c.name)}</a><div class="small muted">Edited ${fmtD(c.editedAt)}</div></div></div>`).join(''):'<div class="muted small" style="padding:10px 0">No drafts.</div>'}</div></div>
   <div class="card"><div class="card-h"><h3>Sender reputation · 30 days</h3></div><div class="card-b" style="padding-top:6px;padding-bottom:6px">${healthRows(a)}</div></div>
  </div>
 </div>
 <div class="muted small mt">${num(totalSubs())} subscribed contacts across ${S.lists.length} lists · ${num(S.totals.suppressed)} addresses on the suppression list.</div>`;}
function miniCampTable(cs){return `<div style="overflow:auto"><table class="t"><thead><tr><th>Campaign</th><th>Sent</th><th class="num">Recipients</th><th class="num">Opens</th><th class="num">Clicks</th></tr></thead><tbody>${cs.map(c=>`<tr class="click" data-act="go" data-href="#/report/${c.id}"><td><span class="title-link">${esc(c.name)}</span><div class="small muted">${esc(audLabel(c))}</div></td><td class="small">${fmtD(c.sendAt)}</td><td class="num">${num(c.stats.recipients)}</td><td class="num">${pct(ratio(c.stats.opens,c.stats.delivered))}</td><td class="num">${pct(ratio(c.stats.clicks,c.stats.delivered),2)}</td></tr>`).join('')}</tbody></table></div>`;}
A.go=t=>{nav(t.dataset.href);};

/* ================= CAMPAIGNS ================= */
function vCampaigns(){const u=UI.camp;
 return `<div class="page-h"><div><h1>Campaigns</h1><div class="sub">${S.campaigns.length} campaigns · ${sentC().length} sent</div></div><div class="flex"><div class="seg"><button class="on">☰ List</button><a class="btn sm ghost" href="#/calendar" style="border-radius:0">▦ Calendar</a></div><button class="btn pri" data-act="newCampaign">+ Create campaign</button></div></div>
 <div class="card">${true?`<div class="toolbar"><input type="search" placeholder="Search name or subject" value="${esc(u.q)}" data-in="campQ" style="width:240px" aria-label="Search campaigns">
 ${sel('campF','status',u.status,[['all','All statuses'],['draft','Drafts'],['scheduled','Scheduled'],['sent','Sent']])}
 ${sel('campF','list',u.list,[['all','All audiences'],...S.lists.map(l=>[l.id,l.name]),['other','Other / deleted audiences']])}
 ${sel('campF','range',u.range,[['all','Any time'],['30','Last 30 days'],['90','Last 90 days'],['365','Last 12 months']])}
 </div><div id="camp-table">${campTable()}</div>`:`<div id="camp-cal">${campCal()}</div>`}</div>`;}
function campFiltered(){const u=UI.camp;let cs=S.campaigns.slice();if(u.q){const q=u.q.toLowerCase();cs=cs.filter(c=>(c.name+' '+c.subject).toLowerCase().includes(q));}if(u.status!=='all')cs=cs.filter(c=>c.status===u.status);if(u.list!=='all')cs=cs.filter(c=>u.list==='other'?!c.listIds.length:c.listIds.includes(u.list));if(u.range!=='all')cs=cs.filter(c=>daysAgo(c.sendAt||c.editedAt)<=+u.range);return cs.sort(byDateDesc);}
function campTable(){const u=UI.camp;const cs=campFiltered();const per=25;const pages=Math.max(1,Math.ceil(cs.length/per));if(u.page>pages)u.page=pages;const rows=cs.slice((u.page-1)*per,u.page*per);
 const bar=u.sel.size?`<div class="sel-bar"><b>${u.sel.size} selected</b><button class="btn sm" data-act="campBulkDelete">Delete</button><button class="btn sm" data-act="campClearSel">Clear selection</button></div>`:'';
 if(!cs.length)return bar+'<div class="empty">No campaigns match these filters.</div>';
 return bar+`<div style="overflow:auto"><table class="t"><thead><tr><th style="width:34px"><input type="checkbox" data-ch="campSelAll" aria-label="Select all" ${rows.length&&rows.every(c=>u.sel.has(c.id))?'checked':''}></th><th>Name</th><th>Status</th><th>Audience</th><th class="num">Recipients</th><th class="num">Opens</th><th class="num">Clicks</th><th class="right">Actions</th></tr></thead><tbody>${rows.map(campRow).join('')}</tbody></table></div>
 <div class="flex between" style="padding:12px 16px;border-top:1px solid var(--line)"><span class="small muted">${num(cs.length)} campaigns</span><div class="flex"><button class="btn sm" data-act="campPage" data-d="-1" ${u.page<=1?'disabled':''}>‹ Prev</button><span class="small">Page ${u.page} of ${pages}</span><button class="btn sm" data-act="campPage" data-d="1" ${u.page>=pages?'disabled':''}>Next ›</button></div></div>`;}
function campRow(c){const s=c.stats;const st=c.status;const date=st==='sent'?'Sent '+fmtDT(c.sendAt):st==='scheduled'?fmtDT(c.sendAt):'Edited '+fmtD(c.editedAt);
 const rec=st==='sent'?num(s.recipients):st==='scheduled'?'≈'+num(audienceOf(c).est):'—';
 return `<tr><td><input type="checkbox" data-ch="campSel" data-id="${c.id}" aria-label="Select" ${UI.camp.sel.has(c.id)?'checked':''}></td>
 <td style="max-width:360px"><a class="title-link" href="#/${st==='sent'?'report':'campaign'}/${c.id}">${esc(c.name)}</a><div class="small muted">${esc(c.subject||'No subject yet')}</div></td>
 <td><span class="badge b-${st}">${cap(st)}</span><div class="small muted" style="margin-top:4px">${date}</div></td>
 <td class="small" style="max-width:200px">${esc(audLabel(c))}</td><td class="num">${rec}</td>
 <td class="num">${st==='sent'?pct(ratio(s.opens,s.delivered)):'—'}</td><td class="num">${st==='sent'?pct(ratio(s.clicks,s.delivered),2):'—'}</td>
 <td class="right"><div class="flex" style="justify-content:flex-end;gap:4px">${st==='sent'?`<a class="btn sm" href="#/report/${c.id}">View report</a>`:`<a class="btn sm" href="#/campaign/${c.id}">Edit</a>`}${campMenu(c)}</div></td></tr>`;}
function campMenu(c){const st=c.status;return `<div class="menu-wrap"><button class="btn sm ghost" data-act="toggleMenu" aria-label="More actions">⋯</button><div class="menu">
 <button data-act="campReplicate" data-id="${c.id}">Replicate</button><button data-act="campRename" data-id="${c.id}">Rename</button><button data-act="campPreview" data-id="${c.id}">Preview email</button>
 ${st==='sent'?`<button data-act="campResend" data-id="${c.id}">Resend to non-openers</button><button data-act="campExport" data-id="${c.id}">Export report (CSV)</button>`:''}
 ${st==='scheduled'?`<button data-act="campUnschedule" data-id="${c.id}">Unschedule</button>`:''}
 <div class="sep"></div><button class="danger" data-act="campDelete" data-id="${c.id}">Delete</button></div></div>`;}
function campCal(){const u=UI.camp;const m=u.month;const y=m.getFullYear(),mo=m.getMonth();const start=new Date(y,mo,1);start.setDate(1-start.getDay());const days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d);}
 const ev=S.campaigns.filter(c=>c.sendAt&&(c.status==='sent'||c.status==='scheduled'));const today=new Date();
 const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
 return `<div class="toolbar"><button class="btn sm" data-act="calNav" data-d="-1" aria-label="Previous month">‹</button><b style="min-width:150px;text-align:center">${MONTHS_FULL[mo]} ${y}</b><button class="btn sm" data-act="calNav" data-d="1" aria-label="Next month">›</button><button class="btn sm" data-act="calNav" data-d="0">Today</button><span class="legend" style="margin-left:auto"><span><i style="background:var(--green-bg);border:1px solid var(--green)"></i>Sent</span><span><i style="background:var(--blue-bg);border:1px solid var(--blue)"></i>Scheduled</span></span></div>
 <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dh">${d}</div>`).join('')}${days.map(d=>{const es=ev.filter(c=>same(new Date(c.sendAt),d));return `<div class="day ${d.getMonth()!==mo?'out':''} ${same(d,today)?'today':''}"><span class="n">${d.getDate()}</span>${es.map(c=>`<a class="ev ${c.status}" href="#/${c.status==='sent'?'report':'campaign'}/${c.id}" title="${esc(c.name)} · ${fmtT(c.sendAt)}">${fmtT(c.sendAt)} ${esc(c.name)}</a>`).join('')}</div>`;}).join('')}</div>`;}
const redrawCamp=()=>{const el=$('#camp-table');if(el)el.innerHTML=campTable();};
IN.campQ=t=>{UI.camp.q=t.value;UI.camp.page=1;redrawCamp();};
CH.campF=t=>{UI.camp[t.dataset.k]=t.value;UI.camp.page=1;redrawCamp();};
CH.campSel=t=>{t.checked?UI.camp.sel.add(t.dataset.id):UI.camp.sel.delete(t.dataset.id);redrawCamp();};
CH.campSelAll=t=>{const u=UI.camp;const rows=campFiltered().slice((u.page-1)*25,u.page*25);rows.forEach(c=>t.checked?u.sel.add(c.id):u.sel.delete(c.id));redrawCamp();};
A.campPage=t=>{UI.camp.page+=+t.dataset.d;redrawCamp();};
A.campView=t=>{UI.camp.view=t.dataset.v;render();};
A.campClearSel=()=>{UI.camp.sel.clear();redrawCamp();};
A.campBulkDelete=()=>{const n=UI.camp.sel.size;confirmBox('Delete '+n+' campaigns?','Reports for sent campaigns are deleted too. This can’t be undone.','Delete',()=>{S.campaigns=S.campaigns.filter(c=>!UI.camp.sel.has(c.id));UI.camp.sel.clear();render();toast(n+' campaigns deleted');});};
A.calNav=t=>{const d=+t.dataset.d;const u=UI.camp;const now=new Date();u.month=d===0?new Date(now.getFullYear(),now.getMonth(),1):new Date(u.month.getFullYear(),u.month.getMonth()+d,1);$('#camp-cal').innerHTML=campCal();};
function newDraft(name){const c=baseCampaign({name,senderId:S.settings.defaultSender,tracking:{opens:S.settings.trackOpens,clicks:S.settings.trackClicks,plain:S.settings.trackPlain,utm:false}});S.campaigns.push(c);return c;}
function cloneCampaign(c){const n=JSON.parse(JSON.stringify(c));Object.assign(n,{id:uid('cm'),name:c.name+' (copy)',status:'draft',sendAt:null,editedAt:nowISO(),createdAt:nowISO(),schedule:{mode:'now',date:'',time:'12:00'}});delete n.stats;S.campaigns.push(n);return n;}
A.newCampaign=t=>{if(t)NC_DAY=null;modal({title:'Create campaign',body:`${NC_DAY?`<div class="notice">Planned for <b>${fmtD(NC_DAY+'T12:00')}</b> at 12:00 PM. You can change the time in the Send time step.</div>`:''}<div class="field"><label for="nc-name">Campaign name <span class="muted small">(only you see this)</span></label><input type="text" id="nc-name" value="Email campaign · ${fmtD(nowISO())}"></div>
 <div class="field"><label for="nc-from">Start from</label><select id="nc-from"><option value="blank">DHT base layout</option><optgroup label="Saved templates">${S.templates.map(t=>`<option value="t:${t.id}">${esc(t.name)}</option>`).join('')}</optgroup><optgroup label="Replicate a recent email">${sentC().sort(byDateDesc).slice(0,10).map(c=>`<option value="c:${c.id}">${esc(c.name)}</option>`).join('')}</optgroup></select><div class="hint">Most DHT emails start from a recent one, the way Replicate works in Mailchimp.</div></div>`,
 foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="ncGo">Begin</button>`,mount:()=>{const i=$('#nc-name');i.focus();i.select();}});};
A.ncGo=()=>{const name=$('#nc-name').value.trim()||'Untitled';const f=$('#nc-from').value;let c;const day=NC_DAY;NC_DAY=null;if(f.startsWith('c:')){c=cloneCampaign(getC(f.slice(2)));c.name=name;}else{c=newDraft(name);if(f.startsWith('t:')){const tp=getT(f.slice(2));c.html=tp.html;c.templateId=tp.id;}else c.html=BLANK();}if(day)c.schedule={mode:'later',date:day,time:'12:00'};closeModal();UI.build.open='to';nav('#/campaign/'+c.id);};
A.campReplicate=t=>{const n=cloneCampaign(getC(t.dataset.id));UI.build.open='to';toast('Replicated as a new draft');nav('#/campaign/'+n.id);};
A.campRename=t=>{const c=getC(t.dataset.id);promptBox('Rename campaign','Campaign name',c.name,v=>{c.name=v;touch(c);render();toast('Renamed');});};
A.campPreview=t=>{const c=getC(t.dataset.id);modal({title:esc(c.subject||c.name),wide:true,body:`<div class="flex between mb small"><span class="muted">From ${esc((getS(c.senderId)||{}).name||'')} · preview as ${esc(sampleContact().first)} at ${esc(sampleContact().practice)}</span><a href="#" data-act="copyHtml" data-id="${c.id}">Copy HTML</a></div><iframe id="cp-frame" class="preview-frame" sandbox="allow-popups" title="Email preview"></iframe>`,mount:()=>{$('#cp-frame').srcdoc=rendered(c.html,null,c);}});};
A.copyHtml=t=>copyText(getC(t.dataset.id).html,'HTML copied');
A.campResend=t=>{const c=getC(t.dataset.id);const non=c.stats.delivered-c.stats.opens;closeModal();modal({title:'Resend to non-openers',body:`<p style="margin-top:0;line-height:1.55">${num(non)} people didn’t open “${esc(c.name)}”. This makes a new draft that goes only to them.</p><div class="field"><label for="rs-subj">New subject line</label><input type="text" id="rs-subj" value="${esc('Reminder: '+c.subject)}"></div><div class="notice warn" style="margin:0">Open tracking isn’t perfect (some people read with images turned off), so a few people who did read it may get the resend too.</div>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="resendGo" data-id="${c.id}">Create draft</button>`});};
A.resendGo=t=>{const c=getC(t.dataset.id);const n=cloneCampaign(c);Object.assign(n,{name:c.name+' · resend to non-openers',subject:$('#rs-subj').value,listIds:[],tagIds:[],segmentIds:[],excludeIds:[],nonOpenersOf:c.id});closeModal();UI.build.open='time';nav('#/campaign/'+n.id);};
A.campExport=t=>{const c=getC(t.dataset.id);const s=c.stats;const rows=[['Campaign',c.name],['Subject',c.subject],['Sent',fmtDT(c.sendAt)],['Audience',audLabel(c)],['Recipients',s.recipients],['Delivered',s.delivered],['Unique opens',s.opens],['Open rate',pct(ratio(s.opens,s.delivered))],['Unique clicks',s.clicks],['Click rate',pct(ratio(s.clicks,s.delivered),2)],['Bounces',s.bounces],['Unsubscribes',s.unsubs],['Spam complaints',s.complaints],[],['URL','Total clicks','Unique clicks'],...linkStats(c).map(l=>[l.url,l.total,l.unique])];download(fileSlug(c.name)+'-report.csv',csv(rows));toast('Report exported');};
A.campUnschedule=t=>{const c=getC(t.dataset.id);c.status='draft';c.sendAt=null;touch(c);render();toast('Unscheduled. It’s a draft again');};
A.campDelete=t=>{const c=getC(t.dataset.id);confirmBox('Delete “'+esc(c.name)+'”?',c.status==='sent'?'Its report will be deleted too. This can’t be undone.':'This can’t be undone.','Delete',()=>{S.campaigns=S.campaigns.filter(x=>x.id!==c.id);UI.camp.sel.delete(c.id);toast('Campaign deleted');if(route()[1]===c.id)nav('#/campaigns');else render();});};

/* ================= CALENDAR ================= */
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayYmd=()=>ymd(new Date());
function nthDow(y,m,dow,n){const d=new Date(y,m,1);const off=(dow-d.getDay()+7)%7;return new Date(y,m,1+off+(n-1)*7);}
function lastDow(y,m,dow){const d=new Date(y,m+1,0);return new Date(y,m,d.getDate()-((d.getDay()-dow+7)%7));}
function usHolidays(y){const h={};const add=(d,n)=>{h[ymd(d)]=n;};
 add(new Date(y,0,1),'New Year’s Day');add(nthDow(y,0,1,3),'MLK Day');add(nthDow(y,1,1,3),'Presidents’ Day');add(new Date(y,1,14),'Valentine’s Day');add(nthDow(y,4,0,2),'Mother’s Day');add(lastDow(y,4,1),'Memorial Day');add(nthDow(y,5,0,3),'Father’s Day');add(new Date(y,5,19),'Juneteenth');add(new Date(y,6,4),'Independence Day');add(nthDow(y,8,1,1),'Labor Day');add(new Date(y,9,31),'Halloween');add(new Date(y,10,11),'Veterans Day');const tg=nthDow(y,10,4,4);add(tg,'Thanksgiving');add(new Date(y,10,tg.getDate()+1),'Black Friday');add(new Date(y,11,24),'Christmas Eve');add(new Date(y,11,25),'Christmas Day');add(new Date(y,11,31),'New Year’s Eve');return h;}
function dayScores(){const by=[0,0,0,0,0,0,0].map(()=>({o:0,d:0}));sentC().forEach(c=>{const g=by[new Date(c.sendAt).getDay()];g.o+=c.stats.opens;g.d+=c.stats.delivered;});const all=aggStats(sentC()).openRate;
 const sc=by.map((g,i)=>({i,r:g.d?g.o/g.d:all*.95,n:g.d}));const wk=sc.filter(x=>x.i>0&&x.i<6).sort((a,b)=>b.r-a.r);const best=new Set(wk.slice(0,2).map(x=>x.i));
 return {best,rate:sc};}
function calDate(c){if(c.status==='sent'||c.status==='scheduled')return c.sendAt?new Date(c.sendAt):null;if(c.schedule.mode==='later'&&c.schedule.date)return new Date(c.schedule.date+'T'+(c.schedule.time||'12:00'));return null;}
function calEvents(){const f=UI.cal.filter;return S.campaigns.filter(c=>calDate(c)&&(f==='all'||c.status===f));}
function calEv(c){const d=calDate(c);const st=c.status;const s=c.stats;
 const tip=[c.name,cap(st)+' · '+fmtDT(d.toISOString()),'To: '+audLabel(c)];if(st==='sent')tip.push('Opens '+pct(ratio(s.opens,s.delivered))+' · Clicks '+pct(ratio(s.clicks,s.delivered),2));if(st!=='sent')tip.push('Drag to another day to reschedule');
 return `<a class="ev ${st}" href="#/${st==='sent'?'report':'campaign'}/${c.id}" ${st!=='sent'?`draggable="true" data-drag="${c.id}"`:''} title="${esc(tip.join('\n'))}"><span class="tm">${st==='draft'?'✎':st==='scheduled'?'◷':'✓'} ${fmtT(d.toISOString())}</span>${esc(c.name)}</a>`;}
function calDays(){const u=UI.cal;const a=u.anchor;if(u.view==='week'){const s=new Date(a);s.setDate(a.getDate()-a.getDay());return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d;});}
 const s=new Date(a.getFullYear(),a.getMonth(),1);s.setDate(1-s.getDay());const n=new Date(a.getFullYear(),a.getMonth()+1,0);const weeks=Math.ceil((n.getDate()+new Date(a.getFullYear(),a.getMonth(),1).getDay())/7);return Array.from({length:weeks*7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d;});}
function calTitle(){const u=UI.cal;const a=u.anchor;if(u.view==='month')return MONTHS_FULL[a.getMonth()]+' '+a.getFullYear();const ds=calDays();const f=ds[0],l=ds[6];return MONTHS[f.getMonth()]+' '+f.getDate()+' – '+(f.getMonth()!==l.getMonth()?MONTHS[l.getMonth()]+' ':'')+l.getDate()+', '+l.getFullYear();}
function calGrid(){const u=UI.cal;const days=calDays();const mo=u.anchor.getMonth();const t=todayYmd();const evs=calEvents();const hol=Object.assign({},usHolidays(days[0].getFullYear()),usHolidays(days[days.length-1].getFullYear()));const sc=dayScores();
 return `<div class="cal ${u.view==='week'?'week':''}">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(d=>`<div class="dh">${d}</div>`).join('')}${days.map(d=>{const k=ymd(d);const es=evs.filter(c=>ymd(calDate(c))===k).sort((x,y)=>calDate(x)-calDate(y));const fut=k>=t;const wd=d.getDay();
  const badge=u.opt&&fut&&wd>0&&wd<6?(sc.best.has(wd)?'<span class="sd best" title="One of your best days: highest average open rate">BEST</span>':'<span class="sd good" title="A good day to send, based on your open rates">GOOD</span>'):'';
  return `<div class="day ${u.view==='month'&&d.getMonth()!==mo?'out':''} ${k===t?'today':''} ${fut?'fut':'past'}" data-day="${k}"><div class="dtop"><span class="n">${d.getDate()}</span>${badge}${fut?`<button class="addday" data-act="calNew" data-day="${k}" title="Create a campaign for ${fmtD(k+'T12:00')}" aria-label="Create a campaign on this day">+</button>`:''}</div>${u.hol&&hol[k]?`<div class="hol">★ ${esc(hol[k])}</div>`:''}${es.map(calEv).join('')}</div>`;}).join('')}</div>`;}
function vCalendar(){const u=UI.cal;const unplanned=S.campaigns.filter(c=>c.status==='draft'&&!calDate(c)).sort(byDateDesc);
 return `<div class="page-h"><div><h1>Campaign calendar</h1><div class="sub">Everything sent, scheduled and planned. Drag a scheduled campaign or draft to another day to move it, or click + on a day to plan a new one.</div></div><div class="flex"><div class="seg"><a class="btn sm ghost" href="#/campaigns" style="border-radius:0">☰ List</a><button class="on">▦ Calendar</button></div><button class="btn pri" data-act="newCampaign">+ Create campaign</button></div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1fr) 250px;align-items:start"><div class="card">
 <div class="toolbar"><button class="btn sm" data-act="calNav2" data-d="-1" aria-label="Previous">‹</button><button class="btn sm" data-act="calNav2" data-d="1" aria-label="Next">›</button><b style="min-width:190px">${calTitle()}</b><button class="btn sm" data-act="calNav2" data-d="0">Today</button>
 <span style="margin-left:auto" class="flex wrap">${sel('calF','filter',u.filter,[['all','All campaigns'],['sent','Sent'],['scheduled','Scheduled'],['draft','Drafts']])}
 <label class="flex small" style="gap:6px;cursor:pointer"><input type="checkbox" data-ch="calT" data-k="hol" ${u.hol?'checked':''}>Holidays</label>
 <label class="flex small" style="gap:6px;cursor:pointer" title="Marks the weekdays your emails get opened most"><input type="checkbox" data-ch="calT" data-k="opt" ${u.opt?'checked':''}>Send day optimization</label>
 <div class="seg"><button class="${u.view==='month'?'on':''}" data-act="calView" data-v="month">Month</button><button class="${u.view==='week'?'on':''}" data-act="calView" data-v="week">Week</button></div></span></div>
 <div id="cal-grid">${calGrid()}</div>
 <div class="flex wrap small muted" style="padding:10px 16px;border-top:1px solid var(--line);gap:16px"><span><span class="ev-key sent"></span>Sent</span><span><span class="ev-key scheduled"></span>Scheduled</span><span><span class="ev-key draft"></span>Draft with a planned date</span><span><span class="sd best">BEST</span> <span class="sd good">GOOD</span> based on your open rates by weekday</span></div></div>

function calMove(id,day){const c=getC(id);if(!c||c.status==='sent')return;if(day<todayYmd()){toast('That day has already passed');return;}
 const time=c.schedule.time||'12:00';const when=new Date(day+'T'+time);
 if(c.status==='scheduled'){if(when<=new Date()){toast('That time has already passed today. Open the campaign to pick a later time');return;}c.schedule.date=day;c.schedule.mode='later';c.sendAt=when.toISOString();touch(c);render();toast('Rescheduled to '+fmtDT(c.sendAt));}
 else{c.schedule={mode:'later',date:day,time};touch(c);render();toast('Planned for '+fmtD(day+'T12:00')+'. Still a draft until you schedule it');}}
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t)return;e.dataTransfer.setData('text/plain',t.dataset.drag);e.dataTransfer.effectAllowed='move';t.classList.add('dragging');});
document.addEventListener('dragend',e=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.day.over').forEach(x=>x.classList.remove('over'));});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('.day[data-day]');if(!d)return;e.preventDefault();$$('.day.over').forEach(x=>{if(x!==d)x.classList.remove('over');});d.classList.add('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.day[data-day]');if(!d)return;e.preventDefault();d.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)calMove(id,d.dataset.day);});

const curC=()=>getC(route()[1]);

 if(c.status==='sent')return `<div class="notice">“${esc(c.name)}” was already sent, so it can’t be edited. <a href="#/report/${c.id}">View its report</a>, or <a href="#" data-act="campReplicate" data-id="${c.id}">replicate it</a> to send it again.</div>`;
 const u=UI.build;if(u.cid!==c.id){u.cid=c.id;if(!u.open)u.open='to';}
 const aud=audienceOf(c);const snd=getS(c.senderId);const d=checks(c);const n=Object.values(d).filter(Boolean).length;
 after.push(()=>updatePreview(c));
 const tName=c.templateId&&getT(c.templateId)?'From template “'+esc(getT(c.templateId).name)+'”':'Custom HTML';
 return `<div class="crumb"><a href="#/campaigns">Campaigns</a> / ${esc(c.name)}</div>
 <div class="page-h"><div class="flex"><h1>${esc(c.name)}</h1><button class="btn sm ghost" data-act="campRename" data-id="${c.id}" title="Rename" aria-label="Rename">✎</button><span class="badge b-${c.status}">${cap(c.status)}</span></div>
 <div class="flex wrap"><button class="btn" data-act="trackSettings" data-id="${c.id}">⚙ Settings & tracking</button><button class="btn" data-act="testSend" data-id="${c.id}">Send a test</button><button class="btn" data-act="finishLater">Finish later</button><button class="btn acc" id="b-send" data-act="sendFlow" data-id="${c.id}" ${n<5?'disabled':''}>${c.schedule.mode==='later'?'Schedule':'Send'}</button></div></div>
 ${c.status==='scheduled'?`<div class="notice">Scheduled for ${fmtDT(c.sendAt)}. Edits save automatically. To stop it, choose <a href="#" data-act="campUnschedule" data-id="${c.id}">Unschedule</a>.</div>`:''}
 <div class="builder"><div class="card">
  <div class="card-b" style="border-bottom:1px solid var(--line)"><div class="flex between small"><b id="b-prog">${n} of 5 complete</b><span class="muted">Changes save automatically</span></div><div class="bar" style="margin-top:8px"><i id="b-bar" style="width:${n/5*100}%"></i></div></div>
  ${item('to','To',d.to,`≈ <b>${num(aud.est)}</b> recipients · ${esc(aud.label)}`,toBody(c))}
  ${item('from','From',d.from,snd?`${esc(snd.name)} · ${esc(snd.email)}`:'Choose a sender',fromBody(c))}
  ${item('subject','Subject',d.subject,c.subject?esc(c.subject)+(c.ab?' · A/B test on':''):'What’s the subject line?',subjectBody(c))}
  ${item('time','Send time',d.time,timeSummary(c),timeBody(c))}
  ${item('content','Content',d.content,c.html?tName+' · plain-text version '+(c.plain==null?'generated automatically':'written by you'):'Design your email',contentBody(c))}
 </div>
 <div class="preview-wrap"><div class="card"><div class="card-h"><div class="seg"><button class="${u.device==='desktop'?'on':''}" data-act="device" data-v="desktop">Desktop</button><button class="${u.device==='mobile'?'on':''}" data-act="device" data-v="mobile">Mobile</button></div><select data-ch="previewAs" aria-label="Preview as contact" style="max-width:220px">${S.sample.slice(0,12).map(x=>`<option value="${x.id}" ${sampleContact().id===x.id?'selected':''}>As ${esc(x.first)} · ${esc(x.practice)}</option>`).join('')}</select></div>
 <div class="card-b" style="background:#f3f2f8"><div class="small" style="margin-bottom:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" id="inbox-line">${inboxLine(c)}</div><iframe id="pv" class="preview-frame ${u.device==='mobile'?'mobile':''}" sandbox="allow-popups" title="Email preview"></iframe></div></div></div></div>`;}
function item(k,title,ok,summary,body){const open=UI.build.open===k;return `<div class="check-item"><div class="check-row"><div class="dot ${ok?'ok':'no'}" id="dot-${k}">${ok?'✓':''}</div><div style="flex:1;min-width:0"><h4>${title}</h4><div class="sum" id="sum-${k}">${summary}</div></div><button class="btn sm" data-act="bOpen" data-k="${k}">${open?'Close':'Edit'}</button></div>${open?`<div class="check-body">${body}</div>`:''}</div>`;}
function toBody(c){
 const opt=(arr,key)=>arr.map(o=>`<label class="switch" style="margin-bottom:8px"><input type="checkbox" data-ch="bInc" data-k="${key}" data-v="${esc(o.v)}" ${c[key].includes(o.v)?'checked':''}><div><b>${esc(o.l)}</b><span>${o.d||''}</span></div></label>`).join('');
 const lists=S.lists.map(l=>({v:l.id,l:l.name,d:num(l.subs)+' subscribed'}));
 const segs=S.segments.map(g=>({v:g.id,l:g.name,d:'≈'+num(segEst(g))+' contacts'}));
 const tags=S.tags.map(t=>({v:t,l:t,d:'≈'+num(tagEst(t))}));
 const exOpts=[...S.lists.map(l=>({v:l.id,l:'List: '+l.name})),...S.segments.map(g=>({v:g.id,l:'Segment: '+g.name})),...S.tags.map(t=>({v:'t:'+t,l:'Tag: '+t}))].filter(o=>!c.excludeIds.includes(o.v));
 return `${c.nonOpenersOf?`<div class="notice">Going to people who didn’t open “${esc((getC(c.nonOpenersOf)||{}).name||'')}”. <a href="#" data-act="clearNonOpen">Pick audiences instead</a></div>`:`
 <div class="grid g3" style="gap:18px"><div><div class="col-h">AUDIENCES</div>${opt(lists,'listIds')}<a class="small" href="#/lists">Manage audiences</a></div><div><div class="col-h">SEGMENTS</div>${opt(segs,'segmentIds')||'<div class="small muted mb">None yet</div>'}<a class="small" href="#" data-act="newSegment">+ New segment</a></div><div><div class="col-h">TAGS</div>${opt(tags,'tagIds')}</div></div>
 <div class="small muted" style="margin:6px 0 14px">Anyone in more than one selected audience gets the email once.</div>
 <div class="field"><label>Don’t send to</label><select data-ch="bExAdd" aria-label="Add an exclusion"><option value="">Add an exclusion…</option>${exOpts.map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')}</select><div style="margin-top:6px">${c.excludeIds.map(e=>`<span class="chip">${esc(exLabel(e))}<button data-act="bExDel" data-v="${esc(e)}" aria-label="Remove">×</button></span>`).join('')}</div></div>`}
 
 <div class="notice" style="margin:0">Unsubscribed, bounced and spam-complaint addresses (${num(S.totals.suppressed)}) are always skipped.</div>`;}
function fromBody(c){const s=getS(c.senderId);return `<div class="field"><label>Sender</label><select data-ch="bSet" data-k="senderId">${S.senders.map(x=>`<option value="${x.id}" ${x.id===c.senderId?'selected':''}>${esc(x.name)} &lt;${esc(x.email)}&gt;</option>`).join('')}</select><div class="hint">Replies go to ${esc(s?s.replyTo:'')}. Any @darkhorsetech.com address can send. <a href="#/settings/senders">Manage senders</a></div></div>`;}
function subjectBody(c){const ab=c.ab;return `<div class="field"><label>Subject line <span class="muted small" id="subj-count">· ${(c.subject||'').length} characters</span></label><input type="text" value="${esc(c.subject)}" data-in="bLive" data-ch="bCommit" data-k="subject" placeholder="e.g. Your Windows 10 ESU Year 2 License"><div class="hint">Under about 60 characters shows in full on most phones. Merge tags work here too, like {{first_name}}.</div></div>
 <div class="field"><label>Preview text</label><input type="text" value="${esc(c.preview)}" data-in="bLive" data-ch="bCommit" data-k="preview" placeholder="Shown after the subject line in most inboxes"></div>
 <label class="switch"><input type="checkbox" data-ch="bAB" ${ab?'checked':''}><div><b>A/B test the subject line</b><span>Sends two subject lines to part of the list, then sends the winner to everyone else.</span></div></label>
 ${ab?`<div class="card" style="padding:14px"><div class="field"><label>Subject line B</label><input type="text" value="${esc(ab.subjectB)}" data-in="bABlive" data-ch="bABset" data-k="subjectB"></div><div class="grid g3"><div class="field"><label>Test group</label>${sel('bABset','split',ab.split,[[10,'10% of list'],[20,'20% of list'],[30,'30% of list'],[50,'50% of list']])}</div><div class="field"><label>Pick winner by</label>${sel('bABset','metric',ab.metric,[['opens','Open rate'],['clicks','Click rate']])}</div><div class="field"><label>Wait before sending winner</label>${sel('bABset','wait',ab.wait,[[2,'2 hours'],[4,'4 hours'],[8,'8 hours'],[24,'24 hours']])}</div></div></div>`:''}`;}
function timeBody(c){const s=c.schedule;const bad=s.mode==='later'&&!futureOK(c);return `<div class="flex wrap" style="gap:24px;margin-bottom:6px"><label class="switch" style="margin:0"><input type="radio" name="when" data-ch="bWhen" value="now" ${s.mode==='now'?'checked':''}><div><b>Send now</b><span>Starts as soon as you confirm</span></div></label><label class="switch" style="margin:0"><input type="radio" name="when" data-ch="bWhen" value="later" ${s.mode==='later'?'checked':''}><div><b>Schedule</b><span>Pick a date and time (Eastern)</span></div></label></div>
 ${s.mode==='later'?`<div class="flex mt"><input type="date" value="${esc(s.date)}" data-ch="bSched" data-k="date" aria-label="Date"><input type="time" value="${esc(s.time)}" data-ch="bSched" data-k="time" aria-label="Time"></div>${bad?'<div class="small" style="color:var(--red);margin-top:6px">Pick a time in the future.</div>':''}`:''}
 <label class="switch mt"><input type="checkbox" data-ch="bResend" ${c.resend?'checked':''}><div><b>Automatically resend to non-openers</b><span>Sends a second email to people who didn’t open the first one.</span></div></label>
 ${c.resend?`<div class="grid g2"><div class="field"><label>Resend subject line</label><input type="text" value="${esc(c.resend.subject)}" data-ch="bResendSet" data-k="subject"></div><div class="field"><label>Send it after</label>${sel('bResendSet','hours',c.resend.hours,[[24,'24 hours'],[48,'48 hours'],[72,'72 hours'],[96,'96 hours']])}</div></div>`:''}`;}
function timeSummary(c){const s=c.schedule;if(s.mode==='now')return 'Send as soon as you confirm'+(c.resend?' · resend to non-openers after '+c.resend.hours+'h':'');if(!futureOK(c))return '<span style="color:var(--red)">Pick a time in the future</span>';return fmtDT(s.date+'T'+s.time)+(c.resend?' · resend to non-openers after '+c.resend.hours+'h':'');}
function contentBody(c){return `<div class="flex wrap"><button class="btn pri" data-act="editHtml" data-id="${c.id}">✎ Edit HTML</button><button class="btn" data-act="pickTemplate" data-id="${c.id}">Choose a template</button><button class="btn" data-act="saveAsTemplate" data-id="${c.id}">Save as template</button><button class="btn" data-act="plainText" data-id="${c.id}">Plain-text version</button></div>
 <div class="small muted mt">A footer with DHT’s mailing address and an unsubscribe link is added to every email automatically. The law requires both.</div>`;}

 const p=$('#b-prog');if(p)p.textContent=n+' of 5 complete';const b=$('#b-bar');if(b)b.style.width=(n/5*100)+'%';const s=$('#b-send');if(s)s.disabled=n<5;
 const sj=$('#sum-subject');if(sj)sj.innerHTML=c.subject?esc(c.subject)+(c.ab?' · A/B test on':''):'What’s the subject line?';const il=$('#inbox-line');if(il)il.innerHTML=inboxLine(c);}

 else if(IMP.step===2){const cols=Math.max(...IMP.rows.slice(0,6).map(r=>r.length));const prev=IMP.rows.slice(IMP.hasHeader?1:0,(IMP.hasHeader?1:0)+5);body=`<p class="muted" style="margin-top:0">Found <b>${num(IMP.rows.length-(IMP.hasHeader?1:0))}</b> rows. Choose what each column holds.</p><label class="switch"><input type="checkbox" data-ch="impHeader" ${IMP.hasHeader?'checked':''}><div><b>The first row is a header</b></div></label><div style="overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="t"><thead><tr>${Array.from({length:cols},(_,i)=>`<th>${sel('impMap',i,IMP.map[i]||'ignore',impFields(),'data-i="'+i+'" aria-label="Column '+(i+1)+'"')}${IMP.hasHeader?`<div class="small muted" style="margin-top:4px;font-weight:500">${esc(IMP.rows[0][i]||'')}</div>`:''}</th>`).join('')}</tr></thead><tbody>${prev.map(r=>`<tr>${Array.from({length:cols},(_,i)=>`<td class="small">${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;foot=`<button class="btn" data-act="impBack">Back</button><button class="btn pri" data-act="impNext">Next: organize</button>`;}

function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='/vendor/xlsx.mini.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>no(new Error('Couldn’t load the Excel reader. Save the file as CSV and try again.'));document.head.appendChild(sc);});}

function guessMap(rows){const h=rows[0]||[];return h.map((v,i)=>{const s=String(v).toLowerCase();if(IMP.hasHeader){if(/e-?mail/.test(s))return 'email';if(/first|fname/.test(s))return 'first';if(/last|lname|surname/.test(s))return 'last';if(/practice|company|office|organi[sz]ation|business/.test(s))return 'practice';if(/phone|mobile|cell/.test(s))return 'phone';if(/title|role|position/.test(s))return 'title';if(/note|comment/.test(s))return 'notes';if(/tag/.test(s))return 'tags';}const col=rows.slice(IMP.hasHeader?1:0,12).map(r=>(r[i]||'').trim());if(col.some(x=>EMAIL_RE.test(x)))return 'email';return 'ignore';});}

 const tags=IMP.tags.split(',').map(s=>s.trim()).filter(Boolean);tags.forEach(t=>{if(!S.tags.includes(t))S.tags.push(t);});
 const data=IMP.rows.slice(IMP.hasHeader?1:0);const r={added:0,updated:0,invalid:0,suppressed:0,dupes:0,listName:list.name,listId:list.id};const seen=new Set();const sup=new Set(S.suppression.map(s=>s.email.toLowerCase()));
 data.forEach(row=>{const o={},cu={};IMP.map.forEach((f,i)=>{const v=(row[i]||'').trim();if(f.startsWith('cf:')){if(v)cu[f.slice(3)]=v;}else if(f!=='ignore')o[f]=v;});const em=(o.email||'').toLowerCase();

  else{const x={id:uid('c'),email:em,first:o.first||'',last:o.last||'',practice:o.practice||'',title:o.title||'',phone:o.phone||'',lists:[list.id],tags:rowTags,status:'subscribed',source:IMP.file?'CSV import':'Pasted list',added:nowISO(),notes:o.notes||'',custom:cu};S.contacts.push(x);list.size++;list.subs++;if(IMP.status==='unsubscribed')suppress(x,'Unsubscribed (imported)');r.added++;}});
